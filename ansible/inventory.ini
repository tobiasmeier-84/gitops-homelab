# Static inventory — matches the fixed IPAM from ADR-0031/0035.
# admin user, key-based auth via ~/.ssh/id_ed25519_vms — same key used
# by cloud-init on every VM, see opentofu/modules/proxmox-vm.

[rke2_nodes]
enceladus ansible_host=10.10.10.41
mimas     ansible_host=10.10.10.42
rhea      ansible_host=10.10.10.43

[haproxy]
triton  ansible_host=10.10.10.31
nereid  ansible_host=10.10.10.32
proteus ansible_host=10.10.10.33

[all:vars]
ansible_ssh_private_key_file=~/.ssh/id_ed25519_vms
ansible_python_interpreter=/usr/bin/python3