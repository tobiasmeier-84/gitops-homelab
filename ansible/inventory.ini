# Static inventory — matches the fixed IPAM from ADR-0031/0035.
# admin user, key-based auth via ~/.ssh/id_ed25519_vms — same key used
# by cloud-init on every VM, see opentofu/modules/proxmox-vm.

[rke2_nodes]
enceladus ansible_host=10.10.10.41 rke2_node_ip=10.10.20.41 rke2_dmz_ingress_ip=10.10.40.41
mimas     ansible_host=10.10.10.42 rke2_node_ip=10.10.20.42 rke2_dmz_ingress_ip=10.10.40.42
rhea      ansible_host=10.10.10.43 rke2_node_ip=10.10.20.43 rke2_dmz_ingress_ip=10.10.40.43

[haproxy]
triton  ansible_host=10.10.10.31 keepalived_priority=110 keepalived_state=MASTER
nereid  ansible_host=10.10.10.32 keepalived_priority=100 keepalived_state=BACKUP
proteus ansible_host=10.10.10.33 keepalived_priority=90  keepalived_state=BACKUP

[all:vars]
ansible_ssh_private_key_file=~/.ssh/id_ed25519_vms
ansible_python_interpreter=/usr/bin/python3