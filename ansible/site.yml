# ansible playbook entry point — imports roles/common, roles/rke2, roles/longhorn-disk, roles/argocd-bootstrap per host group
---
- name: Apply common baseline to every VM
  hosts: all
  roles:
    - common

- name: Install RKE2 (3-node HA server cluster with embedded etcd)
  hosts: rke2_nodes
  serial: 1
  roles:
    - rke2

- name: Install HAProxy + keepalived VRRP trio
  hosts: haproxy
  roles:
    - haproxy

- name: Prepare Longhorn disks on RKE2 nodes
  hosts: rke2_nodes
  roles:
    - longhorn-disk