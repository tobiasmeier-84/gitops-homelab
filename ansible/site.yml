# ansible playbook entry point — imports roles/common, roles/rke2, roles/longhorn-disk, roles/argocd-bootstrap per host group
---
- name: Apply common baseline to every VM
  hosts: all:!belt
  roles:
    - common

- name: Install RKE2 (3-node HA server cluster with embedded etcd)
  hosts: rke2_nodes
  serial: 1
  roles:
    - rke2

- name: Install HAProxy + keepalived VRRP trio
  hosts: haproxy
  roles:
    - haproxy

- name: Prepare Longhorn disks on RKE2 nodes
  hosts: rke2_nodes
  roles:
    - longhorn-disk

- name: Install Longhorn
  hosts: rke2_nodes
  roles:
    - longhorn

- name: Bootstrap ArgoCD and app-of-apps
  hosts: rke2_nodes
  roles:
    - argocd

- name: Configure cert-manager's ClusterIssuer (once cert-manager itself is deployed by ArgoCD)
  hosts: rke2_nodes
  roles:
    - cert-manager-issuer

- name: Configure ArgoCD Entra ID SSO
  hosts: rke2_nodes
  roles:
    - argocd-oidc

- name: Redirect argocd.app.solsys.dev to the primary SSO hostname
  hosts: rke2_nodes
  roles:
    - argocd-app-redirect

- name: Configure Pella DDNS credentials
  hosts: rke2_nodes
  roles:
    - pella-secret

- name: Install Pomerium ZTNA gateway on Deimos
  hosts: deimos
  roles:
    - pomerium

- name: Install CoreDNS
  hosts: dns
  roles:
    - coredns

- name: Trust Pomerium's SSH CA on Proxmox hosts
  hosts: belt
  roles:
    - proxmox-ssh-ca

- name: Trust Pomerium's SSH CA on all admin-plane VMs (except Pomerium's own dependencies)
  hosts: ssh_gated
  roles:
    - proxmox-ssh-ca

- name: Configure Rocinante OIDC credentials
  hosts: rke2_nodes
  roles:
    - rocinante-oidc-secret