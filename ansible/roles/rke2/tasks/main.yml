---
- name: Install RKE2 server binary
  shell: |
    curl -sfL https://get.rke2.io | INSTALL_RKE2_VERSION={{ rke2_version }} INSTALL_RKE2_TYPE=server sh -
  args:
    creates: /usr/local/bin/rke2

- name: Create RKE2 config directory
  file:
    path: /etc/rancher/rke2
    state: directory
    mode: '0755'

# ---- First node: bootstraps the cluster, no token/server needed ----

- name: Deploy config.yaml — first server node (bootstraps cluster)
  template:
    src: config-first.yaml.j2
    dest: /etc/rancher/rke2/config.yaml
    mode: '0600'
  when: inventory_hostname == groups['rke2_nodes'][0]

- name: Start and enable RKE2 on first server node
  systemd:
    name: rke2-server
    enabled: true
    state: started
    daemon_reload: true
  when: inventory_hostname == groups['rke2_nodes'][0]

- name: Wait for node-token to be generated
  wait_for:
    path: /var/lib/rancher/rke2/server/node-token
    timeout: 180
  when: inventory_hostname == groups['rke2_nodes'][0]

- name: Read the generated cluster join token
  slurp:
    src: /var/lib/rancher/rke2/server/node-token
  register: rke2_token_raw
  when: inventory_hostname == groups['rke2_nodes'][0]

- name: Store decoded token as a fact (visible to other hosts via hostvars)
  set_fact:
    rke2_cluster_token: "{{ rke2_token_raw.content | b64decode | trim }}"
  when: inventory_hostname == groups['rke2_nodes'][0]

# ---- Remaining nodes: join as additional servers (HA control-plane + etcd quorum) ----

- name: Deploy config.yaml — joining server nodes
  template:
    src: config-join.yaml.j2
    dest: /etc/rancher/rke2/config.yaml
    mode: '0600'
  when: inventory_hostname != groups['rke2_nodes'][0]

- name: Start and enable RKE2 on joining server nodes
  systemd:
    name: rke2-server
    enabled: true
    state: started
    daemon_reload: true
  when: inventory_hostname != groups['rke2_nodes'][0]