---
- name: Install open-iscsi (required by Longhorn manager's environment check)
  apt:
    name: open-iscsi
    state: present
    update_cache: true

- name: Ensure iscsid is enabled and running
  systemd:
    name: iscsid
    enabled: true
    state: started

- name: Get exact disk sizes in bytes
  command: lsblk -b -d -n -o NAME,SIZE
  register: lsblk_output
  changed_when: false

- name: Identify tachi device (fast/DB-tier disk, ~100GB)
  shell: |
    echo "{{ lsblk_output.stdout }}" | awk '$2 > 90000000000 && $2 < 110000000000 {print "/dev/"$1}'
  register: tachi_device_result
  changed_when: false

- name: Set tachi device fact
  set_fact:
    longhorn_tachi_device: "{{ tachi_device_result.stdout | trim }}"

- name: Get UUID of tachi device
  command: "blkid -s UUID -o value {{ longhorn_tachi_device }}"
  register: tachi_uuid_result
  changed_when: false

- name: Set tachi UUID fact
  set_fact:
    longhorn_tachi_uuid: "{{ tachi_uuid_result.stdout | trim }}"

- name: Fail loudly if tachi wasn't identified
  fail:
    msg: "Could not identify tachi device by size on {{ inventory_hostname }} — check lsblk output manually before proceeding."
  when: longhorn_tachi_device == ""

- name: Format tachi disk with ext4
  filesystem:
    fstype: ext4
    dev: "{{ longhorn_tachi_device }}"

- name: Create mount point for tachi
  file:
    path: /mnt/longhorn/tachi
    state: directory
    mode: '0755'

- name: Mount tachi disk persistently (by UUID, immune to device letter reshuffling)
  mount:
    path: /mnt/longhorn/tachi
    src: "UUID={{ longhorn_tachi_uuid }}"
    fstype: ext4
    state: mounted

# ============================================================================
# LEGACY canterbury (zvol-backed, enceladus ONLY): unchanged since original
# setup. Tagged "bulk" — legacy tag, kept for backward compatibility during
# the ongoing migration. Real, repeated replica-ejection incidents
# (2026-09-27/28) traced to this exact zvol-on-Patriot-adjacent-pool
# architecture on mimas and rhea; both have since been migrated to direct
# raw-disk passthrough (see below). Enceladus's migration is pending —
# once done, this whole section will be removed and enceladus will use the
# same canterbury-replacement pattern as mimas/rhea.
# ============================================================================

- name: Identify canterbury device (legacy zvol, ~900GB) — enceladus only
  shell: |
    echo "{{ lsblk_output.stdout }}" | awk '$2 > 800000000000 && $2 < 1000000000000 {print "/dev/"$1}'
  register: canterbury_device_result
  changed_when: false
  when: inventory_hostname == "enceladus"

- name: Set legacy canterbury device fact
  set_fact:
    longhorn_canterbury_device: "{{ canterbury_device_result.stdout | trim }}"
  when: inventory_hostname == "enceladus"

- name: Format legacy canterbury disk with ext4 (enceladus only)
  filesystem:
    fstype: ext4
    dev: "{{ longhorn_canterbury_device }}"
  when: inventory_hostname == "enceladus"

- name: Get UUID of legacy canterbury device
  command: "blkid -s UUID -o value {{ longhorn_canterbury_device }}"
  register: canterbury_uuid_result
  changed_when: false
  when: inventory_hostname == "enceladus"

- name: Set legacy canterbury UUID fact
  set_fact:
    longhorn_canterbury_uuid: "{{ canterbury_uuid_result.stdout | trim }}"
  when: inventory_hostname == "enceladus"

- name: Create mount point for legacy canterbury (enceladus only)
  file:
    path: /mnt/longhorn/canterbury
    state: directory
    mode: '0755'
  when: inventory_hostname == "enceladus"

- name: Mount legacy canterbury disk persistently (enceladus only)
  mount:
    path: /mnt/longhorn/canterbury
    src: "UUID={{ longhorn_canterbury_uuid }}"
    fstype: ext4
    state: mounted
  when: inventory_hostname == "enceladus"

- name: Register legacy canterbury + tachi with Longhorn (bootstrap annotation, applies once at initial setup) — enceladus only
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/rke2/rke2.yaml
    kind: Node
    name: "{{ inventory_hostname }}"
    definition:
      metadata:
        labels:
          node.longhorn.io/create-default-disk: config
        annotations:
          node.longhorn.io/default-disks-config: |
            [
              {"path":"/mnt/longhorn/canterbury","allowScheduling":true,"tags":["bulk"]},
              {"path":"/mnt/longhorn/tachi","allowScheduling":true,"tags":["fast"]}
            ]
  when: inventory_hostname == "enceladus"

# ============================================================================
# canterbury-replacement, direct raw-disk passthrough (mimas + rhea):
# three separate physical disks each, replacing the old single zvol-backed
# canterbury. Removes ZFS/zvol from Longhorn's data path entirely — real,
# controlled testing (2026-09-29/30) showed a rebuild on this architecture
# completed successfully with ZERO ejections over ~4 hours on mimas, while
# the same volume's replica on rhea's still-zvol-backed disk ejected and
# restarted repeatedly under identical real conditions in the same window
# — a clean, direct A/B confirmation of root cause. See ADR-0005 addendum,
# 2026-09-29/30.
#
# Three-tier scheme: the Patriot (scsi3, genuinely slow — real, measured
# write latency of 300-675ms at low queue depth) is tagged "slow"; the two
# healthy VK0480 disks (scsi4/scsi5) are tagged "general". Registered
# directly via Node CR patch, not the bootstrap annotation, since both
# nodes were already bootstrapped previously — that mechanism only fires
# once, ever, at a node's initial setup (confirmed 2026-09-24).
# ============================================================================

- name: Identify canterbury-replacement disk 1 (Patriot, "slow" tier)
  set_fact:
    ct_slow_device: "/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi3"
  when: inventory_hostname in ["mimas", "rhea"]

- name: Identify canterbury-replacement disk 2 ("general" tier)
  set_fact:
    ct_general1_device: "/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi4"
  when: inventory_hostname in ["mimas", "rhea"]

- name: Identify canterbury-replacement disk 3 ("general" tier)
  set_fact:
    ct_general2_device: "/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi5"
  when: inventory_hostname in ["mimas", "rhea"]

- name: Format canterbury-replacement disks with ext4 (idempotent — skips already-formatted disks)
  filesystem:
    fstype: ext4
    dev: "{{ item }}"
  loop:
    - "{{ ct_slow_device | default('') }}"
    - "{{ ct_general1_device | default('') }}"
    - "{{ ct_general2_device | default('') }}"
  when: inventory_hostname in ["mimas", "rhea"]

- name: Get UUIDs of canterbury-replacement disks
  command: "blkid -s UUID -o value {{ item }}"
  register: ct_uuid_results
  changed_when: false
  loop:
    - "{{ ct_slow_device | default('') }}"
    - "{{ ct_general1_device | default('') }}"
    - "{{ ct_general2_device | default('') }}"
  when: inventory_hostname in ["mimas", "rhea"]

- name: Create mount points for canterbury-replacement disks
  file:
    path: "/mnt/longhorn/{{ item }}"
    state: directory
    mode: '0755'
  loop: ["ct-slow", "ct-general-1", "ct-general-2"]
  when: inventory_hostname in ["mimas", "rhea"]

- name: Mount canterbury-replacement disks persistently (by UUID)
  mount:
    path: "/mnt/longhorn/{{ item.0 }}"
    src: "UUID={{ item.1.stdout }}"
    fstype: ext4
    state: mounted
  loop: "{{ ['ct-slow', 'ct-general-1', 'ct-general-2'] | zip(ct_uuid_results.results | default([])) | list }}"
  when: inventory_hostname in ["mimas", "rhea"]

- name: Register canterbury-replacement disks with Longhorn directly (Node CR patch — these nodes were already bootstrapped, so the one-time annotation won't fire again)
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/rke2/rke2.yaml
    kind: Node
    api_version: longhorn.io/v1beta2
    name: "{{ inventory_hostname }}"
    namespace: longhorn-system
    state: patched
    definition:
      spec:
        disks:
          ct-slow:
            path: /mnt/longhorn/ct-slow
            allowScheduling: true
            tags:
              - slow
          ct-general-1:
            path: /mnt/longhorn/ct-general-1
            allowScheduling: true
            tags:
              - general
          ct-general-2:
            path: /mnt/longhorn/ct-general-2
            allowScheduling: true
            tags:
              - general
  when: inventory_hostname in ["mimas", "rhea"]

- name: Remove mimas/rhea's old canterbury-1/2/3 disk registrations if present (renamed to ct-slow/ct-general-1/ct-general-2 for consistency across both migrated nodes)
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/rke2/rke2.yaml
    kind: Node
    api_version: longhorn.io/v1beta2
    name: "{{ inventory_hostname }}"
    namespace: longhorn-system
    state: patched
    merge_type: json
    definition:
      - op: remove
        path: "/spec/disks/canterbury-{{ item }}"
  loop: ["1", "2", "3"]
  when: inventory_hostname == "mimas"
  ignore_errors: true
