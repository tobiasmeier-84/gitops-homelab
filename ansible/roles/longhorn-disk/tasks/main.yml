---
- name: Install open-iscsi (required by Longhorn manager's environment check)
  apt:
    name: open-iscsi
    state: present
    update_cache: true

- name: Ensure iscsid is enabled and running
  systemd:
    name: iscsid
    enabled: true
    state: started

- name: Get exact disk sizes in bytes
  command: lsblk -b -d -n -o NAME,SIZE
  register: lsblk_output
  changed_when: false

- name: Identify canterbury device (bulk disk, ~900GB after Sept 2026 resize)
  shell: |
    echo "{{ lsblk_output.stdout }}" | awk '$2 > 800000000000 && $2 < 1000000000000 {print "/dev/"$1}'
  register: canterbury_device_result
  changed_when: false

- name: Identify tachi device (fast/DB-tier disk, ~100GB)
  shell: |
    echo "{{ lsblk_output.stdout }}" | awk '$2 > 90000000000 && $2 < 110000000000 {print "/dev/"$1}'
  register: tachi_device_result
  changed_when: false

- name: Set device facts
  set_fact:
    longhorn_canterbury_device: "{{ canterbury_device_result.stdout | trim }}"
    longhorn_tachi_device: "{{ tachi_device_result.stdout | trim }}"

- name: Get UUID of canterbury device
  command: "blkid -s UUID -o value {{ longhorn_canterbury_device }}"
  register: canterbury_uuid_result
  changed_when: false

- name: Get UUID of tachi device
  command: "blkid -s UUID -o value {{ longhorn_tachi_device }}"
  register: tachi_uuid_result
  changed_when: false

- name: Set UUID facts
  set_fact:
    longhorn_canterbury_uuid: "{{ canterbury_uuid_result.stdout | trim }}"
    longhorn_tachi_uuid: "{{ tachi_uuid_result.stdout | trim }}"

- name: Fail loudly if either device wasn't identified
  fail:
    msg: "Could not identify canterbury/tachi devices by size on {{ inventory_hostname }} — check lsblk output manually before proceeding."
  when: longhorn_canterbury_device == "" or longhorn_tachi_device == ""

- name: Format canterbury disk with ext4
  filesystem:
    fstype: ext4
    dev: "{{ longhorn_canterbury_device }}"

- name: Format tachi disk with ext4
  filesystem:
    fstype: ext4
    dev: "{{ longhorn_tachi_device }}"

- name: Create mount point for canterbury
  file:
    path: /mnt/longhorn/canterbury
    state: directory
    mode: '0755'

- name: Create mount point for tachi
  file:
    path: /mnt/longhorn/tachi
    state: directory
    mode: '0755'

- name: Mount canterbury disk persistently (by UUID, immune to device letter reshuffling)
  mount:
    path: /mnt/longhorn/canterbury
    src: "UUID={{ longhorn_canterbury_uuid }}"
    fstype: ext4
    state: mounted

- name: Mount tachi disk persistently (by UUID, immune to device letter reshuffling)
  mount:
    path: /mnt/longhorn/tachi
    src: "UUID={{ longhorn_tachi_uuid }}"
    fstype: ext4
    state: mounted

# ---- Tell Longhorn about both disks, tagged by tier ----

- name: Register canterbury and tachi disks with Longhorn (bootstrap annotation — applies once, at initial node setup)
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/rke2/rke2.yaml
    kind: Node
    name: "{{ inventory_hostname }}"
    definition:
      metadata:
        labels:
          node.longhorn.io/create-default-disk: config
        annotations:
          node.longhorn.io/default-disks-config: |
            [
              {"path":"/mnt/longhorn/canterbury","allowScheduling":true,"tags":["bulk"]},
              {"path":"/mnt/longhorn/tachi","allowScheduling":true,"tags":["fast"]}
            ]

- name: Register restore-usb disk with Longhorn directly (rhea only — uniquely-tagged disk, the ONLY node where this tag exists, guaranteeing replica placement)
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/rke2/rke2.yaml
    kind: Node
    api_version: longhorn.io/v1beta2
    name: rhea
    namespace: longhorn-system
    state: patched
    definition:
      spec:
        disks:
          restore-usb:
            path: /mnt/restore-direct
            allowScheduling: true
            tags:
              - restore
  when: inventory_hostname == "rhea"

# ============================================================================
# scratch-usb (rhea only): mounted DIRECTLY, deliberately NOT registered with
# Longhorn. Real, repeated production incidents (2026-09-23, 2026-09-24) on
# Longhorn's iSCSI/instance-manager layer — even a volume on physically
# dedicated, isolated hardware was still affected, since the failure mode
# lives in Longhorn's own network-attach mechanism, not any specific disk.
# The worker pod is already hard-pinned to rhea (nodeSelector), so Longhorn's
# cross-node flexibility was never actually being used here — mounting
# directly via hostPath genuinely removes the failure mode from this
# volume's path entirely. See ADR-0005 addendum.
# ============================================================================

- name: Identify scratch-usb device (rhea only, scsi3 — dedicated backup scratch disk, mounted directly — NOT via Longhorn)
  set_fact:
    longhorn_scratch_usb_device: "/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi3"
  when: inventory_hostname == "rhea"

- name: Format scratch-usb disk with ext4 (rhea only)
  filesystem:
    fstype: ext4
    dev: "{{ longhorn_scratch_usb_device }}"
  when: inventory_hostname == "rhea"

- name: Get UUID of scratch-usb device
  command: "blkid -s UUID -o value {{ longhorn_scratch_usb_device }}"
  register: scratch_usb_uuid_result
  changed_when: false
  when: inventory_hostname == "rhea"

- name: Set scratch-usb UUID fact
  set_fact:
    longhorn_scratch_usb_uuid: "{{ scratch_usb_uuid_result.stdout | trim }}"
  when: inventory_hostname == "rhea"

- name: Create direct mount point for scratch-usb (deliberately NOT under /mnt/longhorn — no longer Longhorn-managed)
  file:
    path: /mnt/scratch-direct
    state: directory
    mode: '0755'
  when: inventory_hostname == "rhea"

- name: Mount scratch-usb disk persistently (by UUID, immune to device letter reshuffling)
  mount:
    path: /mnt/scratch-direct
    src: "UUID={{ longhorn_scratch_usb_uuid }}"
    fstype: ext4
    state: mounted
  when: inventory_hostname == "rhea"

# ============================================================================
# mimas canterbury-replacement (mimas only): three raw-passthrough physical
# disks (scsi3/4/5), replacing the old zvol-backed canterbury entirely.
# Real, repeated replica-ejection incidents (2026-09-27/28) correlated with
# ZFS sync-write queue latency on the old zvol; this removes that layer,
# testing Longhorn's own documented, recommended direct-attached-storage
# architecture. Registered directly (Node CR patch, not the bootstrap
# annotation) since mimas was already bootstrapped weeks ago with the old
# canterbury — the bootstrap mechanism only fires once, ever, at initial
# setup (confirmed 2026-09-24). All three tagged "bulk", matching the old
# canterbury tag, so the existing StorageClass keeps working unchanged.
# See ADR-0005 addendum, 2026-09-29.
# ============================================================================

- name: Identify mimas canterbury-replacement disk 1 (Patriot, ~954GB)
  set_fact:
    mimas_cant1_device: "/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi3"
  when: inventory_hostname == "mimas"

- name: Identify mimas canterbury-replacement disk 2 (~447GB)
  set_fact:
    mimas_cant2_device: "/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi4"
  when: inventory_hostname == "mimas"

- name: Identify mimas canterbury-replacement disk 3 (~447GB)
  set_fact:
    mimas_cant3_device: "/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi5"
  when: inventory_hostname == "mimas"

- name: Format mimas canterbury-replacement disks with ext4
  filesystem:
    fstype: ext4
    dev: "{{ item }}"
  loop:
    - "{{ mimas_cant1_device | default('') }}"
    - "{{ mimas_cant2_device | default('') }}"
    - "{{ mimas_cant3_device | default('') }}"
  when: inventory_hostname == "mimas"

- name: Get UUIDs of mimas canterbury-replacement disks
  command: "blkid -s UUID -o value {{ item }}"
  register: mimas_cant_uuid_results
  changed_when: false
  loop:
    - "{{ mimas_cant1_device | default('') }}"
    - "{{ mimas_cant2_device | default('') }}"
    - "{{ mimas_cant3_device | default('') }}"
  when: inventory_hostname == "mimas"

- name: Create mount points for mimas canterbury-replacement disks
  file:
    path: "/mnt/longhorn/canterbury-{{ item }}"
    state: directory
    mode: '0755'
  loop: ["1", "2", "3"]
  when: inventory_hostname == "mimas"

- name: Mount mimas canterbury-replacement disks persistently (by UUID)
  mount:
    path: "/mnt/longhorn/canterbury-{{ item.0 }}"
    src: "UUID={{ item.1.stdout }}"
    fstype: ext4
    state: mounted
  loop: "{{ ['1', '2', '3'] | zip(mimas_cant_uuid_results.results | default([])) | list }}"
  when: inventory_hostname == "mimas"

- name: Register mimas canterbury-replacement disks with Longhorn directly (Node CR patch — mimas was already bootstrapped, so the one-time annotation won't fire again)
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/rke2/rke2.yaml
    kind: Node
    api_version: longhorn.io/v1beta2
    name: mimas
    namespace: longhorn-system
    state: patched
    definition:
      spec:
        disks:
          canterbury-1:
            path: /mnt/longhorn/canterbury-1
            allowScheduling: true
            tags:
              - bulk
          canterbury-2:
            path: /mnt/longhorn/canterbury-2
            allowScheduling: true
            tags:
              - bulk
          canterbury-3:
            path: /mnt/longhorn/canterbury-3
            allowScheduling: true
            tags:
              - bulk
  when: inventory_hostname == "mimas"

- name: Set correct ownership for backup worker (UID/GID 33, matches Rocinante's workerRunAsUser)
  file:
    path: /mnt/scratch-direct
    owner: "33"
    group: "33"
    mode: '0755'
  when: inventory_hostname == "rhea"

- name: Identify restore-usb device (rhea only, scsi4 — dedicated backup restore-PVC disk, mounted directly — NOT via Longhorn)
  set_fact:
    longhorn_restore_usb_device: "/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi4"
  when: inventory_hostname == "rhea"

- name: Format restore-usb disk with ext4 (rhea only)
  filesystem:
    fstype: ext4
    dev: "{{ longhorn_restore_usb_device }}"
  when: inventory_hostname == "rhea"

- name: Get UUID of restore-usb device
  command: "blkid -s UUID -o value {{ longhorn_restore_usb_device }}"
  register: restore_usb_uuid_result
  changed_when: false
  when: inventory_hostname == "rhea"

- name: Set restore-usb UUID fact
  set_fact:
    longhorn_restore_usb_uuid: "{{ restore_usb_uuid_result.stdout | trim }}"
  when: inventory_hostname == "rhea"

- name: Create direct mount point for restore-usb
  file:
    path: /mnt/restore-direct
    state: directory
    mode: '0755'
  when: inventory_hostname == "rhea"

- name: Mount restore-usb disk persistently (by UUID, immune to device letter reshuffling)
  mount:
    path: /mnt/restore-direct
    src: "UUID={{ longhorn_restore_usb_uuid }}"
    fstype: ext4
    state: mounted
  when: inventory_hostname == "rhea"

- name: Set correct ownership for backup worker (UID/GID 33, matches Rocinante's workerRunAsUser)
  file:
    path: /mnt/restore-direct
    owner: "33"
    group: "33"
    mode: '0755'
  when: inventory_hostname == "rhea"

- name: Remove mimas's old canterbury disk registration from Longhorn (the physical zvol no longer exists — replaced by canterbury-1/2/3)
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/rke2/rke2.yaml
    kind: Node
    api_version: longhorn.io/v1beta2
    name: mimas
    namespace: longhorn-system
    state: patched
    merge_type: json
    definition:
      - op: remove
        path: /spec/disks/default-disk-38e74521215e511a
  when: inventory_hostname == "mimas"
  ignore_errors: true