---
- name: Install open-iscsi (required by Longhorn manager's environment check)
  apt:
    name: open-iscsi
    state: present
    update_cache: true

- name: Ensure iscsid is enabled and running
  systemd:
    name: iscsid
    enabled: true
    state: started

- name: Get exact disk sizes in bytes
  command: lsblk -b -d -n -o NAME,SIZE
  register: lsblk_output
  changed_when: false

# All three nodes' tachi disks migrated to direct-attach passthrough
# (scsi6, ~500GB NVMe each) by 2026-10-01 — enceladus was the last,
# completing the full migration off the original zvol-backed tachi.
# Reuses the same /mnt/longhorn/tachi mount path for consistency.
- name: Identify tachi device — direct-attach passthrough (scsi6), all three RKE2 nodes
  set_fact:
    tachi_device_result: {"stdout": "/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi6"}
  when: inventory_hostname in ["enceladus", "rhea", "mimas"]

- name: Set tachi device fact
  set_fact:
    longhorn_tachi_device: "{{ tachi_device_result.stdout | trim }}"

- name: Get UUID of tachi device
  command: "blkid -s UUID -o value {{ longhorn_tachi_device }}"
  register: tachi_uuid_result
  changed_when: false

- name: Set tachi UUID fact
  set_fact:
    longhorn_tachi_uuid: "{{ tachi_uuid_result.stdout | trim }}"

- name: Fail loudly if tachi wasn't identified
  fail:
    msg: "Could not identify tachi device by size on {{ inventory_hostname }} — check lsblk output manually before proceeding."
  when: longhorn_tachi_device == ""

- name: Format tachi disk with ext4
  filesystem:
    fstype: ext4
    dev: "{{ longhorn_tachi_device }}"

- name: Create mount point for tachi
  file:
    path: /mnt/longhorn/tachi
    state: directory
    mode: '0755'

- name: Mount tachi disk persistently (by UUID, immune to device letter reshuffling)
  mount:
    path: /mnt/longhorn/tachi
    src: "UUID={{ longhorn_tachi_uuid }}"
    fstype: ext4
    state: mounted

# ============================================================================
# canterbury-replacement, direct raw-disk passthrough (enceladus + mimas +
# rhea — all three RKE2 nodes, migration completed 2026-09-30): three
# separate physical disks each, replacing the old single zvol-backed
# canterbury pool entirely on every node. Removes ZFS/zvol from Longhorn's
# data path — real, controlled testing (2026-09-29/30) showed rebuilds on
# this architecture completing reliably (zero ejections on the healthy
# "general" tier; the Patriot "slow" tier is stable but genuinely slower,
# confirmed via real measurement: 300-675ms per-write latency at low queue
# depth). See ADR-0005 addendum, 2026-09-29/30.
#
# UPDATE 2026-10-01: mimas was fully destroyed and rebuilt from scratch
# after a real, serious incident (see environments/prod/main.tf comment
# on module.mimas for full detail) — it no longer has any live data to
# protect, and now uses the same clean ct-slow/ct-general-1/2 provisioning
# as rhea. The old canterbury-1/2/3 Longhorn disk names were manually
# removed and replaced with ct-slow/ct-general-1/2 (2026-10-01) to match.
#
# Three-tier scheme: the Patriot = "slow" tag; the two healthy VK0480 disks
# = "general" tag. Registered directly via Node CR patch (not the
# bootstrap annotation), since all three nodes were already bootstrapped
# previously — that mechanism only fires once, ever, at initial setup
# (confirmed 2026-09-24).
# ============================================================================

- name: Identify canterbury-replacement disk 1 (Patriot, "slow" tier) — enceladus/rhea only, fresh provisioning
  set_fact:
    ct_slow_device: "/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi3"
  when: inventory_hostname in ["enceladus", "rhea", "mimas"]

- name: Identify canterbury-replacement disk 2 ("general" tier) — enceladus/rhea only, fresh provisioning
  set_fact:
    ct_general1_device: "/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi4"
  when: inventory_hostname in ["enceladus", "rhea", "mimas"]

- name: Identify canterbury-replacement disk 3 ("general" tier) — enceladus/rhea only, fresh provisioning
  set_fact:
    ct_general2_device: "/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi5"
  when: inventory_hostname in ["enceladus", "rhea", "mimas"]

- name: Format canterbury-replacement disks with ext4 — enceladus/rhea only
  filesystem:
    fstype: ext4
    dev: "{{ item }}"
  loop:
    - "{{ ct_slow_device | default('') }}"
    - "{{ ct_general1_device | default('') }}"
    - "{{ ct_general2_device | default('') }}"
  when: inventory_hostname in ["enceladus", "rhea", "mimas"]

- name: Get UUIDs of canterbury-replacement disks — enceladus/rhea only
  command: "blkid -s UUID -o value {{ item }}"
  register: ct_uuid_results
  changed_when: false
  loop:
    - "{{ ct_slow_device | default('') }}"
    - "{{ ct_general1_device | default('') }}"
    - "{{ ct_general2_device | default('') }}"
  when: inventory_hostname in ["enceladus", "rhea", "mimas"]

- name: Create mount points for canterbury-replacement disks — enceladus/rhea only
  file:
    path: "/mnt/longhorn/{{ item }}"
    state: directory
    mode: '0755'
  loop: ["ct-slow", "ct-general-1", "ct-general-2"]
  when: inventory_hostname in ["enceladus", "rhea", "mimas"]

- name: Mount canterbury-replacement disks persistently (by UUID) — enceladus/rhea only
  mount:
    path: "/mnt/longhorn/{{ item.0 }}"
    src: "UUID={{ item.1.stdout }}"
    fstype: ext4
    state: mounted
  loop: "{{ ['ct-slow', 'ct-general-1', 'ct-general-2'] | zip(ct_uuid_results.results | default([])) | list }}"
  when: inventory_hostname in ["enceladus", "rhea", "mimas"]

- name: Register canterbury-replacement disks with Longhorn directly (Node CR patch — these nodes were already bootstrapped, so the one-time annotation won't fire again) — enceladus/rhea only
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/rke2/rke2.yaml
    kind: Node
    api_version: longhorn.io/v1beta2
    name: "{{ inventory_hostname }}"
    namespace: longhorn-system
    state: patched
    definition:
      spec:
        disks:
          ct-slow:
            path: /mnt/longhorn/ct-slow
            allowScheduling: true
            tags:
              - slow
          ct-general-1:
            path: /mnt/longhorn/ct-general-1
            allowScheduling: true
            tags:
              - general
          ct-general-2:
            path: /mnt/longhorn/ct-general-2
            allowScheduling: true
            tags:
              - general
  when: inventory_hostname in ["enceladus", "rhea", "mimas"]

