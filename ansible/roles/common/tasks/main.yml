---
- name: Update apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install baseline packages
  apt:
    name:
      - chrony
      - unattended-upgrades
      - curl
    state: present

- name: Ensure chrony is enabled and running
  systemd:
    name: chrony
    enabled: true
    state: started

- name: Enable unattended-upgrades
  copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: '0644'

- name: Disable SSH password authentication
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: 'PasswordAuthentication no'
  notify: restart sshd

- name: Install Python kubernetes library (needed for kubernetes.core.k8s module)
  apt:
    name: python3-kubernetes
    state: present

- name: Check current timezone
  command: timedatectl show --property=Timezone --value
  register: current_timezone
  changed_when: false

- name: Set timezone to Europe/Zurich (CET/CEST, automatic DST)
  command: timedatectl set-timezone Europe/Zurich
  when: current_timezone.stdout != "Europe/Zurich"

- name: Disable systemd-resolved DNS stub listener (avoid double-management conflicts)
  lineinfile:
    path: /etc/systemd/resolved.conf
    regexp: '^#?DNS='
    line: 'DNS=10.10.10.53 10.10.10.54'
  notify: restart systemd-resolved

- name: Ensure /etc/resolv.conf points at the real resolver config, not the stub
  file:
    src: /run/systemd/resolve/resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: true

# ---- QEMU guest agent (ADR-0053) -------------------------------------------------
# The package is harmless without the Proxmox agent option; the channel appears after
# the VM's next full stop/start with `agent: 1`. The unit is started by udev once the
# channel exists, so it is only started here when the channel is already there.

- name: Install the QEMU guest agent
  apt:
    name: qemu-guest-agent
    state: present
  tags: [guest_agent]

- name: Check for the Proxmox guest agent channel
  stat:
    path: /dev/virtio-ports/org.qemu.guest_agent.0
  register: guest_agent_channel
  tags: [guest_agent]

- name: Start the QEMU guest agent when its channel exists
  systemd:
    name: qemu-guest-agent
    state: started
  when: guest_agent_channel.stat.exists
  tags: [guest_agent]
