---
- name: Add kubectl PATH and KUBECONFIG via /etc/profile.d (applies to all shells, interactive and non-interactive)
  copy:
    dest: /etc/profile.d/rke2-kubectl.sh
    content: |
      export KUBECONFIG=/etc/rancher/rke2/rke2.yaml
      export PATH=$PATH:/var/lib/rancher/rke2/bin
    mode: "0644"
    owner: root
    group: root
  become: true