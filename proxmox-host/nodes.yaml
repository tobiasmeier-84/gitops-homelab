# Per-node values for rendering answer.toml.j2.
# Non-secret — the root password hash lives separately, SOPS-encrypted
# (see secrets/root-password.enc.yaml), and is merged in at render time.

nodes:
  - hostname: ceres
    mgmt_ip: 10.10.10.11
    mgmt_nic_mac_name: "enx9c8e994fac0e"   # from udevadm, not the plain 'eno1' name
    boot_disk_1: "sda"
    boot_disk_2: "sdb"

  - hostname: eros
    mgmt_ip: 10.10.10.12
    mgmt_nic_mac_name: "enx9c8e994fac0e"   # from udevadm, not the plain 'eno1' name
    boot_disk_1: "sda"
    boot_disk_2: "sdb"

  - hostname: pallas
    mgmt_ip: 10.10.10.13
    mgmt_nic_mac_name: "enx3c528265f161"
    boot_disk_1: "sda"
    boot_disk_2: "sdb"