apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.appName }}-backup
  namespace: {{ .Values.namespace }}
spec:
  schedule: "{{ .Values.schedule }}"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: {{ .Values.appName }}-backup
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: orchestrator
              image: alpine/k8s:1.30.3
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              env:
                - name: APP_NAME
                  value: "{{ .Values.appName }}"
                - name: NAMESPACE
                  value: "{{ .Values.namespace }}"
                - name: PVC_NAME
                  value: "{{ .Values.pvcName }}"
                - name: PVC_SIZE
                  value: "{{ .Values.pvcSize }}"
                - name: STORAGE_CLASS
                  value: "{{ .Values.storageClassName }}"
                - name: WORKER_RUN_AS_USER
                  value: "{{ .Values.workerRunAsUser }}"
                - name: NOTIFY_EMAIL
                  value: "{{ .Values.notifyEmail }}"
              envFrom:
                - secretRef:
                    name: backup-chain-credentials
                - secretRef:
                    name: backup-smtp-credentials
              volumeMounts:
                - name: notify-script
                  mountPath: /scripts-notify
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  RUN_ID=$(date +%Y%m%d-%H%M%S)
                  SNAP_NAME="${APP_NAME}-backup-${RUN_ID}"
                  RESTORE_PVC="${APP_NAME}-restore-${RUN_ID}"
                  WORKER_POD="${APP_NAME}-worker-${RUN_ID}"
                  STATUS="UNKNOWN"
                  export RUN_ID APP_NAME

                  cleanup() {
                    echo "Cleaning up..."
                    kubectl logs "$WORKER_POD" -n "$NAMESPACE" --timestamps > /tmp/worker-output.log 2>&1 || echo "(no worker log available)" > /tmp/worker-output.log
                    kubectl delete pod "$WORKER_POD" -n "$NAMESPACE" --ignore-not-found=true
                    kubectl delete pvc "$RESTORE_PVC" -n "$NAMESPACE" --ignore-not-found=true
                    kubectl delete volumesnapshot "$SNAP_NAME" -n "$NAMESPACE" --ignore-not-found=true
                    export STATUS
                    python3 /scripts-notify/notify.py || echo "WARNING: notification failed to send"
                  }
                  trap cleanup EXIT

                  echo "Creating snapshot $SNAP_NAME..."
                  kubectl apply -f - << EOF
                  apiVersion: snapshot.storage.k8s.io/v1
                  kind: VolumeSnapshot
                  metadata:
                    name: $SNAP_NAME
                    namespace: $NAMESPACE
                  spec:
                    volumeSnapshotClassName: longhorn-snapshot-vsc
                    source:
                      persistentVolumeClaimName: $PVC_NAME
                  EOF
                  kubectl wait --for=jsonpath='{.status.readyToUse}'=true "volumesnapshot/$SNAP_NAME" -n "$NAMESPACE" --timeout=1800s

                  echo "Restoring to PVC $RESTORE_PVC (single-replica, disposable)..."
                  kubectl apply -f - << EOF
                  apiVersion: v1
                  kind: PersistentVolumeClaim
                  metadata:
                    name: $RESTORE_PVC
                    namespace: $NAMESPACE
                  spec:
                    accessModes: ["ReadWriteOnce"]
                    storageClassName: longhorn-bulk-single-replica
                    resources:
                      requests:
                        storage: $PVC_SIZE
                    dataSource:
                      name: $SNAP_NAME
                      kind: VolumeSnapshot
                      apiGroup: snapshot.storage.k8s.io
                  EOF
                  kubectl wait --for=jsonpath='{.status.phase}'=Bound "pvc/$RESTORE_PVC" -n "$NAMESPACE" --timeout=1800s

                  echo "Starting worker pod $WORKER_POD (scratch space: direct hostPath mount on rhea, NOT Longhorn — see ADR-0005 addendum)..."
                  kubectl apply -f - << EOF
                  apiVersion: v1
                  kind: Pod
                  metadata:
                    name: $WORKER_POD
                    namespace: $NAMESPACE
                    labels:
                      app: backup-worker
                  spec:
                    restartPolicy: Never
                    # Pinned to rhea: the scratch-direct disk is mounted
                    # directly on this node only, deliberately bypassing
                    # Longhorn (real, repeated production incidents on its
                    # iSCSI/instance-manager layer). hostPath requires
                    # exact node placement, not just "a node with this
                    # StorageClass" — there is no StorageClass anymore.
                    nodeSelector:
                      kubernetes.io/hostname: rhea
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: $WORKER_RUN_AS_USER
                      fsGroup: $WORKER_RUN_AS_USER
                      seccompProfile:
                        type: RuntimeDefault
                    containers:
                      - name: worker
                        image: alpine/k8s:1.30.3
                        securityContext:
                          allowPrivilegeEscalation: false
                          capabilities:
                            drop: ["ALL"]
                        envFrom:
                          - secretRef:
                              name: backup-chain-credentials
                        env:
                          - name: APP_NAME
                            value: "$APP_NAME"
                          - name: RUN_ID
                            value: "$RUN_ID"
                        command: ["/bin/sh", "/scripts/backup-worker.sh"]
                        volumeMounts:
                          - name: data
                            mountPath: /data
                            readOnly: true
                          - name: script
                            mountPath: /scripts
                          - name: scratch
                            mountPath: /scratch
                    volumes:
                      - name: data
                        persistentVolumeClaim:
                          claimName: $RESTORE_PVC
                      - name: script
                        configMap:
                          name: backup-worker-script
                          defaultMode: 0755
                      - name: scratch
                        hostPath:
                          path: /mnt/scratch-direct
                          type: Directory
                  EOF

                  if kubectl wait --for=jsonpath='{.status.phase}'=Succeeded pod/$WORKER_POD -n "$NAMESPACE" --timeout=28800s; then
                    STATUS="SUCCEEDED"
                  else
                    STATUS="FAILED"
                  fi
                  echo "Backup run $RUN_ID: $STATUS"
          volumes:
            - name: notify-script
              configMap:
                name: backup-notify-script
