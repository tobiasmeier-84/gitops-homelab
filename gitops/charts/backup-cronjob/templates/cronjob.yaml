apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.appName }}-backup
  namespace: {{ .Values.namespace }}
spec:
  schedule: "{{ .Values.schedule }}"
{{- if .Values.timeZone }}
  timeZone: "{{ .Values.timeZone }}"
{{- end }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: {{ .Values.appName }}-backup
          restartPolicy: Never
          # Long enough for the SIGTERM trap's cleanup() to run in full
          # (turn off maintenance mode, delete the snapshot/clone
          # PVCs, capture logs) if the job is deleted manually mid-run.
          terminationGracePeriodSeconds: 120
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: orchestrator
              image: alpine/k8s:1.30.3
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              env:
                - name: APP_NAME
                  value: "{{ .Values.appName }}"
                - name: NAMESPACE
                  value: "{{ .Values.namespace }}"
                - name: PVC_NAME
                  value: "{{ .Values.pvcName }}"
                - name: PVC_SIZE
                  value: "{{ .Values.pvcSize }}"
                - name: WORKER_RUN_AS_USER
                  value: "{{ .Values.workerRunAsUser }}"
                - name: NOTIFY_EMAIL
                  value: "{{ .Values.notifyEmail }}"
                - name: NEXTCLOUD_DEPLOYMENT
                  value: "{{ .Values.nextcloudDeployment }}"
                - name: DB_HOST
                  value: "{{ .Values.dbHost }}"
                - name: DB_PORT
                  value: "{{ .Values.dbPort }}"
                - name: UPLOAD_ENABLED
                  value: "{{ .Values.uploadEnabled }}"
              envFrom:
                - secretRef:
                    name: backup-chain-credentials
                - secretRef:
                    name: backup-smtp-credentials
                - secretRef:
                    name: {{ .Values.dbSecretName }}
              volumeMounts:
                - name: notify-script
                  mountPath: /scripts-notify
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  RUN_ID=$(date +%Y%m%d-%H%M%S)
                  SNAPSHOT_NAME="${APP_NAME}-snap-${RUN_ID}"
                  CLONE_PVC="${APP_NAME}-clone-${RUN_ID}"
                  DBDUMP_PVC="${APP_NAME}-dbdump-${RUN_ID}"
                  FILESTAGE_POD="${APP_NAME}-filestage-${RUN_ID}"
                  DBDUMP_POD="${APP_NAME}-dbdump-${RUN_ID}"
                  DBPROCESS_POD="${APP_NAME}-dbprocess-${RUN_ID}"
                  DBSTAGE_POD="${APP_NAME}-dbstage-${RUN_ID}"
                  STAGECHECK_POD="${APP_NAME}-stagecheck-${RUN_ID}"
                  STAGE_PVC="${APP_NAME}-stage"
                  FILE_STATUS="NOT_RUN"
                  DB_DUMP_STATUS="NOT_RUN"
                  DB_PROCESS_STATUS="SKIPPED"
                  DB_STAGE_STATUS="SKIPPED"
                  MAINTENANCE_ON="no"
                  export RUN_ID APP_NAME

                  : > /tmp/worker-output.log

                  log() {
                    msg="$(date -u +%Y-%m-%dT%H:%M:%SZ) $*"
                    echo "$msg"
                    echo "$msg" >> /tmp/worker-output.log
                  }

                  maintenance() {
                    kubectl exec -n "$NAMESPACE" deploy/"$NEXTCLOUD_DEPLOYMENT" -- su -s /bin/sh www-data -c "php occ maintenance:mode --$1"
                  }

                  capture_and_delete_pods() {
                    for p in "$@"; do
                      if kubectl get pod "$p" -n "$NAMESPACE" >/dev/null 2>&1; then
                        echo "=== logs (last 200 lines): $p ===" >> /tmp/worker-output.log
                        kubectl logs "$p" -n "$NAMESPACE" --timestamps --tail=200 >> /tmp/worker-output.log 2>&1 || true
                        kubectl delete pod "$p" -n "$NAMESPACE" --ignore-not-found=true
                      fi
                    done
                  }

                  cleanup() {
                    log "Cleaning up..."
                    if [ "$MAINTENANCE_ON" = "yes" ]; then
                      log "Maintenance mode still on at exit - turning it off"
                      maintenance off || log "WARNING: could not turn maintenance mode off - check Nextcloud manually"
                    fi
                    capture_and_delete_pods "$STAGECHECK_POD" "$DBDUMP_POD" "$DBPROCESS_POD" "$DBSTAGE_POD" "$FILESTAGE_POD"
                    kubectl delete pvc "$CLONE_PVC" -n "$NAMESPACE" --ignore-not-found=true
                    kubectl delete pvc "$DBDUMP_PVC" -n "$NAMESPACE" --ignore-not-found=true
                    kubectl delete volumesnapshot "$SNAPSHOT_NAME" -n "$NAMESPACE" --ignore-not-found=true
                    export STATUS="Prepare - Files: ${FILE_STATUS} | Database: dump=${DB_DUMP_STATUS} process=${DB_PROCESS_STATUS} stage=${DB_STAGE_STATUS}"
                    python3 /scripts-notify/notify.py || echo "WARNING: notification failed to send"
                  }

                  # Returns 0 when the pod reaches Succeeded, 1 on Failed or timeout.
                  wait_pod() {
                    pod_name="$1"
                    timeout_s="$2"
                    elapsed=0
                    while [ "$elapsed" -lt "$timeout_s" ]; do
                      phase=$(kubectl get pod "$pod_name" -n "$NAMESPACE" -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
                      if [ "$phase" = "Succeeded" ]; then
                        return 0
                      fi
                      if [ "$phase" = "Failed" ]; then
                        return 1
                      fi
                      sleep 10
                      elapsed=$((elapsed + 10))
                    done
                    echo "wait_pod: timed out after ${timeout_s}s waiting for $pod_name"
                    return 1
                  }

                  # Returns 0 once the PVC is Bound, 1 on timeout.
                  wait_pvc_bound() {
                    pvc_name="$1"
                    timeout_s="$2"
                    elapsed=0
                    while [ "$elapsed" -lt "$timeout_s" ]; do
                      phase=$(kubectl get pvc "$pvc_name" -n "$NAMESPACE" -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
                      if [ "$phase" = "Bound" ]; then
                        return 0
                      fi
                      sleep 10
                      elapsed=$((elapsed + 10))
                    done
                    echo "wait_pvc_bound: timed out after ${timeout_s}s waiting for $pvc_name"
                    return 1
                  }

                  create_stagecheck_pod() {
                    kubectl apply -f - << EOF
                  apiVersion: v1
                  kind: Pod
                  metadata:
                    name: $STAGECHECK_POD
                    namespace: $NAMESPACE
                    labels:
                      app: backup-worker
                  spec:
                    restartPolicy: Never
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: $WORKER_RUN_AS_USER
                      fsGroup: $WORKER_RUN_AS_USER
                      seccompProfile:
                        type: RuntimeDefault
                    containers:
                      - name: stagecheck
                        image: alpine/k8s:1.30.3
                        securityContext:
                          allowPrivilegeEscalation: false
                          capabilities:
                            drop: ["ALL"]
                        envFrom:
                          - secretRef:
                              name: backup-chain-credentials
                        env:
                          - name: APP_NAME
                            value: "$APP_NAME"
                          - name: RUN_ID
                            value: "$RUN_ID"
                          - name: UPLOAD_ENABLED
                            value: "$UPLOAD_ENABLED"
                        command: ["/bin/sh", "/scripts/stagecheck.sh"]
                        volumeMounts:
                          - name: stage
                            mountPath: /stage
                          - name: scripts
                            mountPath: /scripts
                    volumes:
                      - name: stage
                        persistentVolumeClaim:
                          claimName: $STAGE_PVC
                      - name: scripts
                        configMap:
                          name: backup-worker-script
                  EOF
                  }

                  create_dbdump_pod() {
                    kubectl apply -f - << EOF
                  apiVersion: v1
                  kind: Pod
                  metadata:
                    name: $DBDUMP_POD
                    namespace: $NAMESPACE
                    labels:
                      app: backup-worker
                  spec:
                    restartPolicy: Never
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: $WORKER_RUN_AS_USER
                      fsGroup: $WORKER_RUN_AS_USER
                      seccompProfile:
                        type: RuntimeDefault
                    containers:
                      - name: dbdump
                        image: alpine/k8s:1.30.3
                        securityContext:
                          allowPrivilegeEscalation: false
                          capabilities:
                            drop: ["ALL"]
                        envFrom:
                          - secretRef:
                              name: {{ .Values.dbSecretName }}
                        env:
                          - name: DB_HOST
                            value: "$DB_HOST"
                          - name: DB_PORT
                            value: "$DB_PORT"
                        command: ["/bin/sh", "/scripts/dbdump.sh"]
                        volumeMounts:
                          - name: dbdump-local
                            mountPath: /restore-local
                          - name: scripts
                            mountPath: /scripts
                    volumes:
                      - name: dbdump-local
                        persistentVolumeClaim:
                          claimName: $DBDUMP_PVC
                      - name: scripts
                        configMap:
                          name: backup-pod-scripts
                  EOF
                  }

                  create_dbprocess_pod() {
                    kubectl apply -f - << EOF
                  apiVersion: v1
                  kind: Pod
                  metadata:
                    name: $DBPROCESS_POD
                    namespace: $NAMESPACE
                    labels:
                      app: backup-worker
                  spec:
                    restartPolicy: Never
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: $WORKER_RUN_AS_USER
                      fsGroup: $WORKER_RUN_AS_USER
                      seccompProfile:
                        type: RuntimeDefault
                    containers:
                      - name: dbprocess
                        image: alpine/k8s:1.30.3
                        securityContext:
                          allowPrivilegeEscalation: false
                          capabilities:
                            drop: ["ALL"]
                        command: ["/bin/sh", "/scripts/dbprocess.sh"]
                        volumeMounts:
                          - name: dbdump-local
                            mountPath: /restore-local
                            readOnly: true
                          - name: scripts
                            mountPath: /scripts
                    volumes:
                      - name: dbdump-local
                        persistentVolumeClaim:
                          claimName: $DBDUMP_PVC
                      - name: scripts
                        configMap:
                          name: backup-pod-scripts
                  EOF
                  }

                  create_dbstage_pod() {
                    kubectl apply -f - << EOF
                  apiVersion: v1
                  kind: Pod
                  metadata:
                    name: $DBSTAGE_POD
                    namespace: $NAMESPACE
                    labels:
                      app: backup-worker
                  spec:
                    restartPolicy: Never
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: $WORKER_RUN_AS_USER
                      fsGroup: $WORKER_RUN_AS_USER
                      seccompProfile:
                        type: RuntimeDefault
                    containers:
                      - name: dbstage
                        image: alpine/k8s:1.30.3
                        securityContext:
                          allowPrivilegeEscalation: false
                          capabilities:
                            drop: ["ALL"]
                        envFrom:
                          - secretRef:
                              name: backup-chain-credentials
                        env:
                          - name: APP_NAME
                            value: "$APP_NAME"
                          - name: RUN_ID
                            value: "$RUN_ID"
                          - name: UPLOAD_ENABLED
                            value: "$UPLOAD_ENABLED"
                          - name: ITEM_KIND
                            value: "db"
                        command: ["/bin/sh", "/scripts/stage-item.sh"]
                        volumeMounts:
                          - name: dbdump-local
                            mountPath: /dbdump
                            readOnly: true
                          - name: stage
                            mountPath: /stage
                          - name: scripts
                            mountPath: /scripts
                    volumes:
                      - name: dbdump-local
                        persistentVolumeClaim:
                          claimName: $DBDUMP_PVC
                      - name: stage
                        persistentVolumeClaim:
                          claimName: $STAGE_PVC
                      - name: scripts
                        configMap:
                          name: backup-worker-script
                  EOF
                  }

                  create_filestage_pod() {
                    kubectl apply -f - << EOF
                  apiVersion: v1
                  kind: Pod
                  metadata:
                    name: $FILESTAGE_POD
                    namespace: $NAMESPACE
                    labels:
                      app: backup-worker
                  spec:
                    restartPolicy: Never
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: $WORKER_RUN_AS_USER
                      fsGroup: $WORKER_RUN_AS_USER
                      seccompProfile:
                        type: RuntimeDefault
                    containers:
                      - name: filestage
                        image: alpine/k8s:1.30.3
                        securityContext:
                          allowPrivilegeEscalation: false
                          capabilities:
                            drop: ["ALL"]
                        envFrom:
                          - secretRef:
                              name: backup-chain-credentials
                        env:
                          - name: APP_NAME
                            value: "$APP_NAME"
                          - name: RUN_ID
                            value: "$RUN_ID"
                          - name: UPLOAD_ENABLED
                            value: "$UPLOAD_ENABLED"
                          - name: ITEM_KIND
                            value: "files"
                        command: ["/bin/sh", "/scripts/stage-item.sh"]
                        volumeMounts:
                          - name: clone-data
                            mountPath: /data
                            readOnly: true
                          - name: stage
                            mountPath: /stage
                          - name: scripts
                            mountPath: /scripts
                    volumes:
                      - name: clone-data
                        persistentVolumeClaim:
                          claimName: $CLONE_PVC
                      - name: stage
                        persistentVolumeClaim:
                          claimName: $STAGE_PVC
                      - name: scripts
                        configMap:
                          name: backup-worker-script
                  EOF
                  }

                  trap cleanup EXIT
                  trap 'exit 143' TERM INT

                  log "PHASE 0: checking the staging volume (a previous backup still waiting for its upload must not be overwritten)"
                  create_stagecheck_pod
                  if wait_pod "$STAGECHECK_POD" 900; then
                    log "Staging volume is free"
                    capture_and_delete_pods "$STAGECHECK_POD"
                  else
                    SC_EXIT=$(kubectl get pod "$STAGECHECK_POD" -n "$NAMESPACE" -o jsonpath='{.status.containerStatuses[0].state.terminated.exitCode}' 2>/dev/null || echo "")
                    capture_and_delete_pods "$STAGECHECK_POD"
                    if [ "$SC_EXIT" = "3" ]; then
                      FILE_STATUS="SKIPPED_PREVIOUS_UPLOAD_NOT_FINISHED"
                      DB_DUMP_STATUS="SKIPPED"
                      log "RESULT - Files: ${FILE_STATUS} | Database: dump=${DB_DUMP_STATUS} - the previous backup is still being uploaded; no snapshot taken, Nextcloud untouched"
                      exit 0
                    fi
                    FILE_STATUS="FAILED"
                    log "FATAL: the stage check failed (exit code '${SC_EXIT}') - no snapshot taken, Nextcloud untouched"
                    exit 1
                  fi

                  log "PHASE 1: brief maintenance window - snapshot AND db dump must both capture the exact same consistent moment"
                  MAINTENANCE_ON="yes"
                  maintenance on
                  T_ON=$(date +%s)

                  kubectl apply -f - << EOF
                  apiVersion: snapshot.storage.k8s.io/v1
                  kind: VolumeSnapshot
                  metadata:
                    name: $SNAPSHOT_NAME
                    namespace: $NAMESPACE
                  spec:
                    volumeSnapshotClassName: longhorn-snapshot-vsc
                    source:
                      persistentVolumeClaimName: $PVC_NAME
                  EOF

                  SNAP_READY="no"
                  elapsed=0
                  while [ "$elapsed" -lt 120 ]; do
                    ready=$(kubectl get volumesnapshot "$SNAPSHOT_NAME" -n "$NAMESPACE" -o jsonpath='{.status.readyToUse}' 2>/dev/null || echo "")
                    if [ "$ready" = "true" ]; then
                      SNAP_READY="yes"
                      break
                    fi
                    sleep 3
                    elapsed=$((elapsed + 3))
                  done

                  if [ "$SNAP_READY" = "yes" ]; then
                    log "Snapshot ready - now dumping the DB, still inside the same maintenance window, for a matching consistent moment"
                    kubectl apply -f - << EOF
                  apiVersion: v1
                  kind: PersistentVolumeClaim
                  metadata:
                    name: $DBDUMP_PVC
                    namespace: $NAMESPACE
                  spec:
                    storageClassName: longhorn-general-single-replica
                    accessModes:
                      - ReadWriteOnce
                    resources:
                      requests:
                        storage: {{ .Values.dbPvcSize }}
                  EOF
                    wait_pvc_bound "$DBDUMP_PVC" 60 || log "WARNING: dbdump PVC did not bind within 60s - dump pod will likely fail"
                    create_dbdump_pod
                    if wait_pod "$DBDUMP_POD" 1800; then
                      DB_DUMP_STATUS="SUCCEEDED"
                    else
                      DB_DUMP_STATUS="FAILED"
                    fi
                  else
                    log "Snapshot never became ready - skipping DB dump too, since it could no longer match a consistent file state"
                  fi

                  maintenance off
                  MAINTENANCE_ON="no"
                  log "Maintenance mode OFF - window was $(( $(date +%s) - T_ON ))s"
                  capture_and_delete_pods "$DBDUMP_POD"

                  if [ "$DB_DUMP_STATUS" = "SUCCEEDED" ]; then
                    log "DB: verifying the dump (app already back online)"
                    create_dbprocess_pod
                    if wait_pod "$DBPROCESS_POD" 600; then
                      DB_PROCESS_STATUS="SUCCEEDED"
                    else
                      DB_PROCESS_STATUS="FAILED"
                    fi
                    capture_and_delete_pods "$DBPROCESS_POD"
                  fi

                  if [ "$DB_PROCESS_STATUS" = "SUCCEEDED" ] && [ "$UPLOAD_ENABLED" = "true" ]; then
                    log "DB: encrypting the verified dump into the staging volume (keys go to both vaults first)"
                    create_dbstage_pod
                    if wait_pod "$DBSTAGE_POD" 3600; then
                      DB_STAGE_STATUS="STAGED"
                    else
                      DB_STAGE_STATUS="FAILED"
                    fi
                    capture_and_delete_pods "$DBSTAGE_POD"
                  elif [ "$DB_PROCESS_STATUS" = "SUCCEEDED" ]; then
                    log "TEST MODE (uploadEnabled=false): dump verified, nothing staged"
                    DB_STAGE_STATUS="SKIPPED_TEST_MODE"
                  fi

                  if [ "$SNAP_READY" != "yes" ]; then
                    log "FATAL: snapshot never became ready - aborting file backup"
                    FILE_STATUS="FAILED"
                  else
                    CLONE_SIZE=$(kubectl get volumesnapshot "$SNAPSHOT_NAME" -n "$NAMESPACE" -o jsonpath='{.status.restoreSize}' 2>/dev/null || echo "")
                    if [ -z "$CLONE_SIZE" ]; then CLONE_SIZE=$(kubectl get pvc "$PVC_NAME" -n "$NAMESPACE" -o jsonpath='{.status.capacity.storage}'); fi
                    log "Clone size (must equal the snapshot size exactly) = $CLONE_SIZE"

                    kubectl apply -f - << EOF
                  apiVersion: v1
                  kind: PersistentVolumeClaim
                  metadata:
                    name: $CLONE_PVC
                    namespace: $NAMESPACE
                  spec:
                    storageClassName: longhorn-slow-single-replica
                    dataSource:
                      name: $SNAPSHOT_NAME
                      kind: VolumeSnapshot
                      apiGroup: snapshot.storage.k8s.io
                    accessModes:
                      - ReadWriteOnce
                    resources:
                      requests:
                        storage: $CLONE_SIZE
                  EOF

                    if wait_pvc_bound "$CLONE_PVC" 120; then
                      log "Clone PVC bound. Starting the file stage pod (it cannot read /data until the full clone is complete - expect hours on the slow tier)"
                      create_filestage_pod
                      if wait_pod "$FILESTAGE_POD" 43200; then
                        if [ "$UPLOAD_ENABLED" = "true" ]; then FILE_STATUS="STAGED"; else FILE_STATUS="VERIFIED_NOT_STAGED_TEST_MODE"; fi
                      else
                        FILE_STATUS="FAILED"
                      fi
                      capture_and_delete_pods "$FILESTAGE_POD"
                    else
                      log "Clone PVC never bound - aborting file backup"
                      FILE_STATUS="FAILED"
                    fi
                  fi

                  log "RESULT - Files: ${FILE_STATUS} | Database: dump=${DB_DUMP_STATUS} process=${DB_PROCESS_STATUS} stage=${DB_STAGE_STATUS}"
                  log "Backup run $RUN_ID finished"
          volumes:
            - name: notify-script
              configMap:
                name: backup-notify-script
