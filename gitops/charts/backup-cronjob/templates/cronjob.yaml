apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.appName }}-backup
  namespace: {{ .Values.namespace }}
spec:
  schedule: "{{ .Values.schedule }}"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: {{ .Values.appName }}-backup
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: orchestrator
              image: alpine/k8s:1.30.3
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              env:
                - name: APP_NAME
                  value: "{{ .Values.appName }}"
                - name: NAMESPACE
                  value: "{{ .Values.namespace }}"
                - name: PVC_NAME
                  value: "{{ .Values.pvcName }}"
                - name: PVC_SIZE
                  value: "{{ .Values.pvcSize }}"
                - name: WORKER_RUN_AS_USER
                  value: "{{ .Values.workerRunAsUser }}"
                - name: NOTIFY_EMAIL
                  value: "{{ .Values.notifyEmail }}"
                - name: NEXTCLOUD_DEPLOYMENT
                  value: "{{ .Values.nextcloudDeployment }}"
                - name: DB_HOST
                  value: "{{ .Values.dbHost }}"
                - name: DB_PORT
                  value: "{{ .Values.dbPort }}"
              envFrom:
                - secretRef:
                    name: backup-chain-credentials
                - secretRef:
                    name: backup-smtp-credentials
                - secretRef:
                    name: {{ .Values.dbSecretName }}
              volumeMounts:
                - name: notify-script
                  mountPath: /scripts-notify
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  RUN_ID=$(date +%Y%m%d-%H%M%S)
                  FILE_COPY_PVC="${APP_NAME}-filecopy-${RUN_ID}"
                  DB_COPY_PVC="${APP_NAME}-dbcopy-${RUN_ID}"
                  COPY_POD="${APP_NAME}-filecopy-${RUN_ID}"
                  DBDUMP_POD="${APP_NAME}-dbdump-${RUN_ID}"
                  TRANSFER_POD="${APP_NAME}-transfer-${RUN_ID}"
                  FILEPROCESS_POD="${APP_NAME}-fileprocess-${RUN_ID}"
                  DBPROCESS_POD="${APP_NAME}-dbprocess-${RUN_ID}"
                  FILE_COPY_STATUS="NOT_RUN"
                  FILE_PROCESS_STATUS="SKIPPED"
                  DB_DUMP_STATUS="NOT_RUN"
                  DB_PROCESS_STATUS="SKIPPED"
                  MAINTENANCE_ON="no"
                  export RUN_ID APP_NAME

                  : > /tmp/worker-output.log

                  log() {
                    msg="$(date -u +%H:%M:%SZ) $*"
                    echo "$msg"
                    echo "$msg" >> /tmp/worker-output.log
                  }

                  maintenance() {
                    kubectl exec -n "$NAMESPACE" deploy/"$NEXTCLOUD_DEPLOYMENT" -- su -s /bin/sh www-data -c "php occ maintenance:mode --$1"
                  }

                  # Saves a pod's logs into the report attachment BEFORE deleting the pod.
                  capture_and_delete() {
                    for p in "$@"; do
                      if kubectl get pod "$p" -n "$NAMESPACE" >/dev/null 2>&1; then
                        echo "=== logs: $p ===" >> /tmp/worker-output.log
                        kubectl logs "$p" -n "$NAMESPACE" --timestamps >> /tmp/worker-output.log 2>&1 || true
                        kubectl delete pod "$p" -n "$NAMESPACE" --ignore-not-found=true
                      fi
                    done
                  }

                  cleanup() {
                    log "Cleaning up..."
                    if [ "$MAINTENANCE_ON" = "yes" ]; then
                      log "Maintenance mode still on at exit - turning it off"
                      maintenance off || log "WARNING: could not turn maintenance mode off - check Nextcloud manually"
                    fi
                    capture_and_delete "$COPY_POD" "$DBDUMP_POD" "$TRANSFER_POD" "$FILEPROCESS_POD" "$DBPROCESS_POD"
                    kubectl delete pvc "$FILE_COPY_PVC" "$DB_COPY_PVC" -n "$NAMESPACE" --ignore-not-found=true --wait=false
                    export STATUS="Files: copy=${FILE_COPY_STATUS} process=${FILE_PROCESS_STATUS} | Database: dump=${DB_DUMP_STATUS} process=${DB_PROCESS_STATUS} (encryption/upload/prune not yet enabled)"
                    python3 /scripts-notify/notify.py || echo "WARNING: notification failed to send"
                  }
                  trap cleanup EXIT

                  # Returns 0 when the pod reaches Succeeded, 1 on Failed or timeout (returns immediately on Failed).
                  wait_pod() {
                    pod_name="$1"
                    timeout_s="$2"
                    elapsed=0
                    while [ "$elapsed" -lt "$timeout_s" ]; do
                      phase=$(kubectl get pod "$pod_name" -n "$NAMESPACE" -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
                      if [ "$phase" = "Succeeded" ]; then
                        return 0
                      fi
                      if [ "$phase" = "Failed" ]; then
                        return 1
                      fi
                      sleep 10
                      elapsed=$((elapsed + 10))
                    done
                    echo "wait_pod: timed out after ${timeout_s}s waiting for $pod_name"
                    return 1
                  }

                  # Returns 0 when the file exists in the pod, 1 if the pod ends first or on timeout.
                  wait_file() {
                    pod_name="$1"
                    path="$2"
                    timeout_s="$3"
                    elapsed=0
                    while [ "$elapsed" -lt "$timeout_s" ]; do
                      phase=$(kubectl get pod "$pod_name" -n "$NAMESPACE" -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
                      if [ "$phase" = "Failed" ] || [ "$phase" = "Succeeded" ]; then
                        return 1
                      fi
                      if kubectl exec -n "$NAMESPACE" "$pod_name" -- test -f "$path" >/dev/null 2>&1; then
                        return 0
                      fi
                      sleep 30
                      elapsed=$((elapsed + 30))
                    done
                    echo "wait_file: timed out after ${timeout_s}s waiting for $path in $pod_name"
                    return 1
                  }

                  create_pvcs() {
                    kubectl apply -f - << EOF
                  apiVersion: v1
                  kind: PersistentVolumeClaim
                  metadata:
                    name: $FILE_COPY_PVC
                    namespace: $NAMESPACE
                  spec:
                    accessModes: ["ReadWriteOnce"]
                    storageClassName: longhorn-canterbury-single-replica
                    resources:
                      requests:
                        storage: $PVC_SIZE
                  ---
                  apiVersion: v1
                  kind: PersistentVolumeClaim
                  metadata:
                    name: $DB_COPY_PVC
                    namespace: $NAMESPACE
                  spec:
                    accessModes: ["ReadWriteOnce"]
                    storageClassName: longhorn-canterbury-single-replica
                    resources:
                      requests:
                        storage: 5Gi
                  EOF
                  }

                  create_copy_pod() {
                    kubectl apply -f - << EOF
                  apiVersion: v1
                  kind: Pod
                  metadata:
                    name: $COPY_POD
                    namespace: $NAMESPACE
                    labels:
                      app: backup-worker
                  spec:
                    restartPolicy: Never
                    affinity:
                      podAffinity:
                        requiredDuringSchedulingIgnoredDuringExecution:
                          - labelSelector:
                              matchExpressions:
                                - key: app.kubernetes.io/name
                                  operator: In
                                  values:
                                    - nextcloud
                                - key: app.kubernetes.io/component
                                  operator: In
                                  values:
                                    - app
                            topologyKey: kubernetes.io/hostname
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: $WORKER_RUN_AS_USER
                      fsGroup: $WORKER_RUN_AS_USER
                      seccompProfile:
                        type: RuntimeDefault
                    containers:
                      - name: copy
                        image: alpine/k8s:1.30.3
                        securityContext:
                          allowPrivilegeEscalation: false
                          capabilities:
                            drop: ["ALL"]
                        command: ["/bin/sh", "/scripts/copy.sh"]
                        volumeMounts:
                          - name: live-data
                            mountPath: /live-data
                            readOnly: true
                          - name: copy-target
                            mountPath: /copy-target
                          - name: scripts
                            mountPath: /scripts
                    volumes:
                      - name: live-data
                        persistentVolumeClaim:
                          claimName: $PVC_NAME
                      - name: copy-target
                        persistentVolumeClaim:
                          claimName: $FILE_COPY_PVC
                      - name: scripts
                        configMap:
                          name: backup-pod-scripts
                  EOF
                  }

                  create_dbdump_pod() {
                    kubectl apply -f - << EOF
                  apiVersion: v1
                  kind: Pod
                  metadata:
                    name: $DBDUMP_POD
                    namespace: $NAMESPACE
                    labels:
                      app: backup-worker
                  spec:
                    restartPolicy: Never
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: $WORKER_RUN_AS_USER
                      fsGroup: $WORKER_RUN_AS_USER
                      seccompProfile:
                        type: RuntimeDefault
                    containers:
                      - name: dbdump
                        image: alpine/k8s:1.30.3
                        securityContext:
                          allowPrivilegeEscalation: false
                          capabilities:
                            drop: ["ALL"]
                        envFrom:
                          - secretRef:
                              name: {{ .Values.dbSecretName }}
                        env:
                          - name: DB_HOST
                            value: "$DB_HOST"
                          - name: DB_PORT
                            value: "$DB_PORT"
                        command: ["/bin/sh", "/scripts/dbdump.sh"]
                        volumeMounts:
                          - name: dbcopy
                            mountPath: /dbcopy
                          - name: scripts
                            mountPath: /scripts
                    volumes:
                      - name: dbcopy
                        persistentVolumeClaim:
                          claimName: $DB_COPY_PVC
                      - name: scripts
                        configMap:
                          name: backup-pod-scripts
                  EOF
                  }

                  create_transfer_pod() {
                    kubectl apply -f - << EOF
                  apiVersion: v1
                  kind: Pod
                  metadata:
                    name: $TRANSFER_POD
                    namespace: $NAMESPACE
                    labels:
                      app: backup-worker
                  spec:
                    restartPolicy: Never
                    nodeSelector:
                      kubernetes.io/hostname: rhea
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: $WORKER_RUN_AS_USER
                      fsGroup: $WORKER_RUN_AS_USER
                      seccompProfile:
                        type: RuntimeDefault
                    containers:
                      - name: transfer
                        image: alpine/k8s:1.30.3
                        securityContext:
                          allowPrivilegeEscalation: false
                          capabilities:
                            drop: ["ALL"]
                        command: ["/bin/sh", "/scripts/transfer.sh"]
                        volumeMounts:
                          - name: fast-copy
                            mountPath: /fast-copy
                            readOnly: true
                          - name: restore-local
                            mountPath: /restore-local
                          - name: scripts
                            mountPath: /scripts
                    volumes:
                      - name: fast-copy
                        persistentVolumeClaim:
                          claimName: $FILE_COPY_PVC
                      - name: restore-local
                        hostPath:
                          path: /mnt/restore-direct
                          type: Directory
                      - name: scripts
                        configMap:
                          name: backup-pod-scripts
                  EOF
                  }

                  create_fileprocess_pod() {
                    kubectl apply -f - << EOF
                  apiVersion: v1
                  kind: Pod
                  metadata:
                    name: $FILEPROCESS_POD
                    namespace: $NAMESPACE
                    labels:
                      app: backup-worker
                  spec:
                    restartPolicy: Never
                    nodeSelector:
                      kubernetes.io/hostname: rhea
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: $WORKER_RUN_AS_USER
                      fsGroup: $WORKER_RUN_AS_USER
                      seccompProfile:
                        type: RuntimeDefault
                    containers:
                      - name: fileprocess
                        image: alpine/k8s:1.30.3
                        securityContext:
                          allowPrivilegeEscalation: false
                          capabilities:
                            drop: ["ALL"]
                        env:
                          - name: APP_NAME
                            value: "$APP_NAME"
                          - name: RUN_ID
                            value: "$RUN_ID"
                        command: ["/bin/sh", "/scripts/fileprocess.sh"]
                        volumeMounts:
                          - name: restore-local
                            mountPath: /restore-local
                            readOnly: true
                          - name: scratch
                            mountPath: /scratch
                          - name: scripts
                            mountPath: /scripts
                    volumes:
                      - name: restore-local
                        hostPath:
                          path: /mnt/restore-direct
                          type: Directory
                      - name: scratch
                        hostPath:
                          path: /mnt/scratch-direct
                          type: Directory
                      - name: scripts
                        configMap:
                          name: backup-pod-scripts
                  EOF
                  }

                  create_dbprocess_pod() {
                    kubectl apply -f - << EOF
                  apiVersion: v1
                  kind: Pod
                  metadata:
                    name: $DBPROCESS_POD
                    namespace: $NAMESPACE
                    labels:
                      app: backup-worker
                  spec:
                    restartPolicy: Never
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: $WORKER_RUN_AS_USER
                      fsGroup: $WORKER_RUN_AS_USER
                      seccompProfile:
                        type: RuntimeDefault
                    containers:
                      - name: dbprocess
                        image: alpine/k8s:1.30.3
                        securityContext:
                          allowPrivilegeEscalation: false
                          capabilities:
                            drop: ["ALL"]
                        command: ["/bin/sh", "/scripts/dbprocess.sh"]
                        volumeMounts:
                          - name: dbcopy
                            mountPath: /dbcopy
                          - name: scripts
                            mountPath: /scripts
                    volumes:
                      - name: dbcopy
                        persistentVolumeClaim:
                          claimName: $DB_COPY_PVC
                      - name: scripts
                        configMap:
                          name: backup-pod-scripts
                  EOF
                  }

                  log "Creating disposable canterbury-backed PVCs for the file copy and the DB dump..."
                  create_pvcs
                  kubectl wait --for=jsonpath='{.status.phase}'=Bound "pvc/$FILE_COPY_PVC" -n "$NAMESPACE" --timeout=300s
                  kubectl wait --for=jsonpath='{.status.phase}'=Bound "pvc/$DB_COPY_PVC" -n "$NAMESPACE" --timeout=300s

                  log "PHASE 1: file copy pass 1 (application ONLINE)"
                  create_copy_pod
                  if wait_file "$COPY_POD" /tmp/pass1-done 14400; then
                    log "Pass 1 finished. PHASE 2: maintenance mode ON, pass 2 + DB dump in parallel"
                    MAINTENANCE_ON="yes"
                    maintenance on
                    T_ON=$(date +%s)
                    log "Maintenance mode ON"
                    create_dbdump_pod
                    SIGNALED="yes"
                    kubectl exec -n "$NAMESPACE" "$COPY_POD" -- touch /tmp/start-pass2 || SIGNALED="no"
                    if [ "$SIGNALED" = "yes" ] && wait_pod "$COPY_POD" 1800; then
                      FILE_COPY_STATUS="SUCCEEDED"
                    else
                      FILE_COPY_STATUS="FAILED"
                    fi
                    if wait_pod "$DBDUMP_POD" 1800; then
                      DB_DUMP_STATUS="SUCCEEDED"
                    else
                      DB_DUMP_STATUS="FAILED"
                    fi
                    maintenance off
                    MAINTENANCE_ON="no"
                    log "Maintenance mode OFF - window was $(( $(date +%s) - T_ON ))s"
                  else
                    FILE_COPY_STATUS="FAILED"
                    log "Pass 1 failed - skipping maintenance mode (nothing to coordinate), dumping the DB on its own"
                    create_dbdump_pod
                    if wait_pod "$DBDUMP_POD" 1800; then
                      DB_DUMP_STATUS="SUCCEEDED"
                    else
                      DB_DUMP_STATUS="FAILED"
                    fi
                  fi
                  capture_and_delete "$DBDUMP_POD"

                  if [ "$DB_DUMP_STATUS" = "SUCCEEDED" ]; then
                    log "DB: verifying the dump"
                    create_dbprocess_pod
                    if wait_pod "$DBPROCESS_POD" 1800; then
                      DB_PROCESS_STATUS="SUCCEEDED"
                    else
                      DB_PROCESS_STATUS="FAILED"
                    fi
                    capture_and_delete "$DBPROCESS_POD"
                  fi

                  if [ "$FILE_COPY_STATUS" = "SUCCEEDED" ]; then
                    capture_and_delete "$COPY_POD"
                    log "PHASE 3: transferring the copy to rhea's USB disk (app is back online, slow is fine)"
                    create_transfer_pod
                    if wait_pod "$TRANSFER_POD" 14400; then
                      capture_and_delete "$TRANSFER_POD"
                      kubectl delete pvc "$FILE_COPY_PVC" -n "$NAMESPACE" --ignore-not-found=true --wait=false
                      log "PHASE 4: compress and verify"
                      create_fileprocess_pod
                      if wait_pod "$FILEPROCESS_POD" 28800; then
                        FILE_PROCESS_STATUS="SUCCEEDED"
                      else
                        FILE_PROCESS_STATUS="FAILED"
                      fi
                      capture_and_delete "$FILEPROCESS_POD"
                    else
                      FILE_PROCESS_STATUS="FAILED_AT_TRANSFER"
                    fi
                  fi
                  log "Backup run $RUN_ID finished"
          volumes:
            - name: notify-script
              configMap:
                name: backup-notify-script
