apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.appName }}-backup
  namespace: {{ .Values.namespace }}
spec:
  schedule: "{{ .Values.schedule }}"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: {{ .Values.appName }}-backup
          restartPolicy: Never
          # Long enough for the SIGTERM trap's cleanup() to run in full
          # (turn off maintenance mode, delete the snapshot/clone/scratch
          # PVCs, capture logs) if the job is deleted manually mid-run.
          terminationGracePeriodSeconds: 120
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: orchestrator
              image: alpine/k8s:1.30.3
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              env:
                - name: APP_NAME
                  value: "{{ .Values.appName }}"
                - name: NAMESPACE
                  value: "{{ .Values.namespace }}"
                - name: PVC_NAME
                  value: "{{ .Values.pvcName }}"
                - name: PVC_SIZE
                  value: "{{ .Values.pvcSize }}"
                - name: WORKER_RUN_AS_USER
                  value: "{{ .Values.workerRunAsUser }}"
                - name: NOTIFY_EMAIL
                  value: "{{ .Values.notifyEmail }}"
                - name: NEXTCLOUD_DEPLOYMENT
                  value: "{{ .Values.nextcloudDeployment }}"
                - name: DB_HOST
                  value: "{{ .Values.dbHost }}"
                - name: DB_PORT
                  value: "{{ .Values.dbPort }}"
              envFrom:
                - secretRef:
                    name: backup-chain-credentials
                - secretRef:
                    name: backup-smtp-credentials
                - secretRef:
                    name: {{ .Values.dbSecretName }}
              volumeMounts:
                - name: notify-script
                  mountPath: /scripts-notify
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  RUN_ID=$(date +%Y%m%d-%H%M%S)
                  SNAPSHOT_NAME="${APP_NAME}-snap-${RUN_ID}"
                  CLONE_PVC="${APP_NAME}-clone-${RUN_ID}"
                  SCRATCH_PVC="${APP_NAME}-scratch-${RUN_ID}"
                  WORKER_POD="${APP_NAME}-worker-${RUN_ID}"
                  DBDUMP_POD="${APP_NAME}-dbdump-${RUN_ID}"
                  DBPROCESS_POD="${APP_NAME}-dbprocess-${RUN_ID}"
                  FILE_STATUS="NOT_RUN"
                  DB_DUMP_STATUS="NOT_RUN"
                  DB_PROCESS_STATUS="SKIPPED"
                  MAINTENANCE_ON="no"
                  export RUN_ID APP_NAME

                  : > /tmp/worker-output.log

                  log() {
                    msg="$(date -u +%H:%M:%SZ) $*"
                    echo "$msg"
                    echo "$msg" >> /tmp/worker-output.log
                  }

                  maintenance() {
                    kubectl exec -n "$NAMESPACE" deploy/"$NEXTCLOUD_DEPLOYMENT" -- su -s /bin/sh www-data -c "php occ maintenance:mode --$1"
                  }

                  capture_and_delete_pods() {
                    for p in "$@"; do
                      if kubectl get pod "$p" -n "$NAMESPACE" >/dev/null 2>&1; then
                        echo "=== logs (last 200 lines): $p ===" >> /tmp/worker-output.log
                        kubectl logs "$p" -n "$NAMESPACE" --timestamps --tail=200 >> /tmp/worker-output.log 2>&1 || true
                        kubectl delete pod "$p" -n "$NAMESPACE" --ignore-not-found=true
                      fi
                    done
                  }

                  cleanup() {
                    log "Cleaning up..."
                    if [ "$MAINTENANCE_ON" = "yes" ]; then
                      log "Maintenance mode still on at exit - turning it off"
                      maintenance off || log "WARNING: could not turn maintenance mode off - check Nextcloud manually"
                    fi
                    capture_and_delete_pods "$WORKER_POD" "$DBDUMP_POD" "$DBPROCESS_POD"
                    kubectl delete pvc "$CLONE_PVC" -n "$NAMESPACE" --ignore-not-found=true
                    kubectl delete pvc "$SCRATCH_PVC" -n "$NAMESPACE" --ignore-not-found=true
                    kubectl delete volumesnapshot "$SNAPSHOT_NAME" -n "$NAMESPACE" --ignore-not-found=true
                    export STATUS="Files: ${FILE_STATUS} | Database: dump=${DB_DUMP_STATUS} process=${DB_PROCESS_STATUS}"
                    python3 /scripts-notify/notify.py || echo "WARNING: notification failed to send"
                  }

                  # Returns 0 when the pod reaches Succeeded, 1 on Failed or timeout.
                  wait_pod() {
                    pod_name="$1"
                    timeout_s="$2"
                    elapsed=0
                    while [ "$elapsed" -lt "$timeout_s" ]; do
                      phase=$(kubectl get pod "$pod_name" -n "$NAMESPACE" -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
                      if [ "$phase" = "Succeeded" ]; then
                        return 0
                      fi
                      if [ "$phase" = "Failed" ]; then
                        return 1
                      fi
                      sleep 10
                      elapsed=$((elapsed + 10))
                    done
                    echo "wait_pod: timed out after ${timeout_s}s waiting for $pod_name"
                    return 1
                  }

                  # Reads the live PVC's real, current capacity and adds 10% headroom,
                  # rather than trusting a static Helm value that could drift from
                  # reality as the volume grows over time. Kubernetes quantity suffixes
                  # (Gi/Mi/Ti) are parsed with a plain shell split, numeric part scaled
                  # by 1.1 and rounded up (awk, since POSIX shell has no float math).
                  compute_sized_with_headroom() {
                    live_size=$(kubectl get pvc "$PVC_NAME" -n "$NAMESPACE" -o jsonpath='{.status.capacity.storage}')
                    if [ -z "$live_size" ]; then
                      echo "compute_sized_with_headroom: could not read live PVC size, falling back to PVC_SIZE=$PVC_SIZE" >&2
                      echo "$PVC_SIZE"
                      return
                    fi
                    num=$(echo "$live_size" | sed 's/[A-Za-z]*$//')
                    unit=$(echo "$live_size" | sed 's/^[0-9]*//')
                    scaled=$(awk -v n="$num" 'BEGIN { printf "%d", (n * 1.1) + 0.9999 }')
                    echo "${scaled}${unit}"
                  }

                  # Returns 0 once the PVC is Bound, 1 on timeout.
                  wait_pvc_bound() {
                    pvc_name="$1"
                    timeout_s="$2"
                    elapsed=0
                    while [ "$elapsed" -lt "$timeout_s" ]; do
                      phase=$(kubectl get pvc "$pvc_name" -n "$NAMESPACE" -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
                      if [ "$phase" = "Bound" ]; then
                        return 0
                      fi
                      sleep 10
                      elapsed=$((elapsed + 10))
                    done
                    echo "wait_pvc_bound: timed out after ${timeout_s}s waiting for $pvc_name"
                    return 1
                  }

                  create_dbdump_pod() {
                    kubectl apply -f - << EOF
                  apiVersion: v1
                  kind: Pod
                  metadata:
                    name: $DBDUMP_POD
                    namespace: $NAMESPACE
                    labels:
                      app: backup-worker
                  spec:
                    restartPolicy: Never
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: $WORKER_RUN_AS_USER
                      fsGroup: $WORKER_RUN_AS_USER
                      seccompProfile:
                        type: RuntimeDefault
                    containers:
                      - name: dbdump
                        image: alpine/k8s:1.30.3
                        securityContext:
                          allowPrivilegeEscalation: false
                          capabilities:
                            drop: ["ALL"]
                        envFrom:
                          - secretRef:
                              name: {{ .Values.dbSecretName }}
                        env:
                          - name: DB_HOST
                            value: "$DB_HOST"
                          - name: DB_PORT
                            value: "$DB_PORT"
                        command: ["/bin/sh", "/scripts/dbdump.sh"]
                        volumeMounts:
                          - name: dbdump-local
                            mountPath: /restore-local
                          - name: scripts
                            mountPath: /scripts
                    volumes:
                      - name: dbdump-local
                        emptyDir: {}
                      - name: scripts
                        configMap:
                          name: backup-pod-scripts
                  EOF
                  }

                  create_dbprocess_pod() {
                    kubectl apply -f - << EOF
                  apiVersion: v1
                  kind: Pod
                  metadata:
                    name: $DBPROCESS_POD
                    namespace: $NAMESPACE
                    labels:
                      app: backup-worker
                  spec:
                    restartPolicy: Never
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: $WORKER_RUN_AS_USER
                      fsGroup: $WORKER_RUN_AS_USER
                      seccompProfile:
                        type: RuntimeDefault
                    containers:
                      - name: dbprocess
                        image: alpine/k8s:1.30.3
                        securityContext:
                          allowPrivilegeEscalation: false
                          capabilities:
                            drop: ["ALL"]
                        command: ["/bin/sh", "/scripts/dbprocess.sh"]
                        volumeMounts:
                          - name: dbdump-local
                            mountPath: /restore-local
                            readOnly: true
                          - name: scripts
                            mountPath: /scripts
                    volumes:
                      - name: dbdump-local
                        emptyDir: {}
                      - name: scripts
                        configMap:
                          name: backup-pod-scripts
                  EOF
                  }

                  create_worker_pod() {
                    kubectl apply -f - << EOF
                  apiVersion: v1
                  kind: Pod
                  metadata:
                    name: $WORKER_POD
                    namespace: $NAMESPACE
                    labels:
                      app: backup-worker
                  spec:
                    restartPolicy: Never
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: $WORKER_RUN_AS_USER
                      fsGroup: $WORKER_RUN_AS_USER
                      seccompProfile:
                        type: RuntimeDefault
                    containers:
                      - name: worker
                        image: alpine/k8s:1.30.3
                        securityContext:
                          allowPrivilegeEscalation: false
                          capabilities:
                            drop: ["ALL"]
                        envFrom:
                          - secretRef:
                              name: backup-chain-credentials
                        env:
                          - name: APP_NAME
                            value: "$APP_NAME"
                          - name: RUN_ID
                            value: "$RUN_ID"
                        command: ["/bin/sh", "/scripts/backup-worker.sh"]
                        volumeMounts:
                          - name: clone-data
                            mountPath: /data
                            readOnly: true
                          - name: scratch
                            mountPath: /scratch
                          - name: scripts
                            mountPath: /scripts
                    volumes:
                      - name: clone-data
                        persistentVolumeClaim:
                          claimName: $CLONE_PVC
                      - name: scratch
                        persistentVolumeClaim:
                          claimName: $SCRATCH_PVC
                      - name: scripts
                        configMap:
                          name: backup-pod-scripts
                  EOF
                  }

                  trap cleanup EXIT
                  trap 'exit 143' TERM INT

                  log "PHASE 1: brief maintenance window - snapshot AND db dump must both capture the exact same consistent moment"
                  MAINTENANCE_ON="yes"
                  maintenance on
                  T_ON=$(date +%s)

                  kubectl apply -f - << EOF
                  apiVersion: snapshot.storage.k8s.io/v1
                  kind: VolumeSnapshot
                  metadata:
                    name: $SNAPSHOT_NAME
                    namespace: $NAMESPACE
                  spec:
                    volumeSnapshotClassName: longhorn-snapshot-vsc
                    source:
                      persistentVolumeClaimName: $PVC_NAME
                  EOF

                  SNAP_READY="no"
                  elapsed=0
                  while [ "$elapsed" -lt 120 ]; do
                    ready=$(kubectl get volumesnapshot "$SNAPSHOT_NAME" -n "$NAMESPACE" -o jsonpath='{.status.readyToUse}' 2>/dev/null || echo "")
                    if [ "$ready" = "true" ]; then
                      SNAP_READY="yes"
                      break
                    fi
                    sleep 3
                    elapsed=$((elapsed + 3))
                  done

                  if [ "$SNAP_READY" = "yes" ]; then
                    log "Snapshot ready - now dumping the DB, still inside the same maintenance window, for a matching consistent moment"
                    create_dbdump_pod
                    if wait_pod "$DBDUMP_POD" 600; then
                      DB_DUMP_STATUS="SUCCEEDED"
                    else
                      DB_DUMP_STATUS="FAILED"
                    fi
                  else
                    log "Snapshot never became ready - skipping DB dump too, since it could no longer match a consistent file state"
                  fi

                  maintenance off
                  MAINTENANCE_ON="no"
                  log "Maintenance mode OFF - window was $(( $(date +%s) - T_ON ))s"
                  capture_and_delete_pods "$DBDUMP_POD"

                  if [ "$SNAP_READY" != "yes" ]; then
                    log "FATAL: snapshot never became ready - aborting file backup"
                    FILE_STATUS="FAILED"
                  else
                    SIZED_WITH_HEADROOM=$(compute_sized_with_headroom)
                    log "Live PVC size + 10% headroom = $SIZED_WITH_HEADROOM (used for both the clone and scratch PVCs)"

                    kubectl apply -f - << EOF
                  apiVersion: v1
                  kind: PersistentVolumeClaim
                  metadata:
                    name: $CLONE_PVC
                    namespace: $NAMESPACE
                  spec:
                    storageClassName: longhorn-slow-single-replica
                    dataSource:
                      name: $SNAPSHOT_NAME
                      kind: VolumeSnapshot
                      apiGroup: snapshot.storage.k8s.io
                    accessModes:
                      - ReadWriteOnce
                    resources:
                      requests:
                        storage: $SIZED_WITH_HEADROOM
                  EOF

                    kubectl apply -f - << EOF
                  apiVersion: v1
                  kind: PersistentVolumeClaim
                  metadata:
                    name: $SCRATCH_PVC
                    namespace: $NAMESPACE
                  spec:
                    storageClassName: longhorn-general-single-replica
                    accessModes:
                      - ReadWriteOnce
                    resources:
                      requests:
                        storage: $SIZED_WITH_HEADROOM
                  EOF

                    if wait_pvc_bound "$CLONE_PVC" 120; then
                      log "Clone PVC bound. Starting worker pod (this will wait for the full clone to complete before it can actually read /data - expect this to take a real while on the slow tier)"
                      create_worker_pod
                      if wait_pod "$WORKER_POD" 28800; then
                        FILE_STATUS="SUCCEEDED"
                      else
                        FILE_STATUS="FAILED"
                      fi
                      capture_and_delete_pods "$WORKER_POD"
                    else
                      log "Clone PVC never bound - aborting file backup"
                      FILE_STATUS="FAILED"
                    fi
                  fi

                  log "PHASE 3: verify the DB dump (file processing already running independently in the background via the worker pod above)"
                  if [ "$DB_DUMP_STATUS" = "SUCCEEDED" ]; then
                    log "DB: verifying the dump"
                    create_dbprocess_pod
                    if wait_pod "$DBPROCESS_POD" 1800; then
                      DB_PROCESS_STATUS="SUCCEEDED"
                    else
                      DB_PROCESS_STATUS="FAILED"
                    fi
                    capture_and_delete_pods "$DBPROCESS_POD"
                  fi

                  log "Backup run $RUN_ID finished"
          volumes:
            - name: notify-script
              configMap:
                name: backup-notify-script