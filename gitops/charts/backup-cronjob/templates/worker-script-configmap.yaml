apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-worker-script
  namespace: {{ .Values.namespace }}
data:
  backup-worker.sh: |
    #!/bin/sh
    set -e

    echo "Installing age, zstd, aws-cli, unzip into alternate root..."
    mkdir -p /tmp/pkgroot
    apk add --no-cache --root /tmp/pkgroot --initdb --repositories-file /etc/apk/repositories --allow-untrusted age zstd aws-cli unzip curl jq || echo "apk had non-fatal post-install trigger errors (expected under non-root), continuing"
    export LD_LIBRARY_PATH="/tmp/pkgroot/usr/lib:/tmp/pkgroot/lib:$LD_LIBRARY_PATH"

    AWS="/tmp/pkgroot/usr/bin/aws"
    AWS_PY="/tmp/pkgroot/usr/bin/python3"
    AGE="/tmp/pkgroot/usr/bin/age"
    AGE_KEYGEN="/tmp/pkgroot/usr/bin/age-keygen"
    ZSTD="/tmp/pkgroot/usr/bin/zstd"
    UNZIP="/tmp/pkgroot/usr/bin/unzip"
    CURL="/tmp/pkgroot/usr/bin/curl"
    CURL_OPTS="-k"
    JQ="/tmp/pkgroot/usr/bin/jq"

    ARCHIVE="/tmp/${APP_NAME}-${RUN_ID}.tar.zst"
    echo "Compressing /data (single intermediate file, deleted after upload)..."
    tar -C /data -cf - . | "$ZSTD" -T0 -o "$ARCHIVE"

    echo "Generating Chain A keypair..."
    "$AGE_KEYGEN" -o /tmp/chain-a.key 2>/tmp/chain-a-pub.txt
    CHAIN_A_PUBKEY=$(grep "Public key:" /tmp/chain-a-pub.txt | awk '{print $NF}')
    CHAIN_A_PRIVKEY=$(cat /tmp/chain-a.key)

    echo "Generating Chain B keypair..."
    "$AGE_KEYGEN" -o /tmp/chain-b.key 2>/tmp/chain-b-pub.txt
    CHAIN_B_PUBKEY=$(grep "Public key:" /tmp/chain-b-pub.txt | awk '{print $NF}')
    CHAIN_B_PRIVKEY=$(cat /tmp/chain-b.key)

    echo "Encrypting and uploading Chain A blob to OVHcloud (streamed, no intermediate file)..."
    export AWS_ACCESS_KEY_ID="$OVH_S3_ACCESS_KEY"
    export AWS_SECRET_ACCESS_KEY="$OVH_S3_SECRET_KEY"
    "$AGE" -r "$CHAIN_A_PUBKEY" "$ARCHIVE" | "$AWS_PY" "$AWS" s3 cp - "s3://scopuli-chain-a-backup/${APP_NAME}-${RUN_ID}.age" \
      --endpoint-url https://s3.eu-west-par.io.cloud.ovh.net

    echo "Encrypting and uploading Chain B blob to Backblaze (streamed, no intermediate file)..."
    export AWS_ACCESS_KEY_ID="$B2_KEY_ID"
    export AWS_SECRET_ACCESS_KEY="$B2_KEY_SECRET"
    "$AGE" -r "$CHAIN_B_PUBKEY" "$ARCHIVE" | "$AWS_PY" "$AWS" s3 cp - "s3://barbapiccola-chain-b-backup/${APP_NAME}-${RUN_ID}.age" \
      --endpoint-url https://s3.eu-central-003.backblazeb2.com

    echo "Removing compressed archive (no longer needed)..."
    rm -f "$ARCHIVE"

    echo "Storing Chain A key in Azure Key Vault..."
    AZ_TOKEN=$($CURL $CURL_OPTS -s -X POST "https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/v2.0/token" \
      -d "grant_type=client_credentials&client_id=${AZURE_CLIENT_ID}&client_secret=${AZURE_CLIENT_SECRET}&scope=https://vault.azure.net/.default" \
      | "$JQ" -r '.access_token')
    $CURL $CURL_OPTS -s -X PUT "https://kv-solsys-chainb.vault.azure.net/secrets/${APP_NAME}-${RUN_ID}?api-version=7.4" \
      -H "Authorization: Bearer $AZ_TOKEN" -H "Content-Type: application/json" \
      -d "{\"value\":\"$CHAIN_A_PRIVKEY\"}" -o /dev/null -w "Azure Key Vault store: HTTP %{http_code}\n"

    echo "Storing Chain B key in Bitwarden Secrets Manager..."
    $CURL $CURL_OPTS -sL https://github.com/bitwarden/sdk-sm/releases/download/bws-v2.1.0/bws-x86_64-unknown-linux-musl-2.1.0.zip -o /tmp/bws.zip
    "$UNZIP" -o /tmp/bws.zip -d /tmp
    export BWS_SERVER_URL="https://vault.bitwarden.eu"
    /tmp/bws secret create --access-token "$BW_ACCESS_TOKEN" "${APP_NAME}-${RUN_ID}" "$CHAIN_B_PRIVKEY" "$BW_PROJECT_ID" > /dev/null
    echo "Bitwarden secret stored successfully"

    echo "=== Pruning old backups (keeping 2 most recent per chain) ==="

    echo "Pruning Chain A (OVHcloud)..."
    export AWS_ACCESS_KEY_ID="$OVH_S3_ACCESS_KEY"
    export AWS_SECRET_ACCESS_KEY="$OVH_S3_SECRET_KEY"
    CHAIN_A_OLD=$("$AWS_PY" "$AWS" s3 ls "s3://scopuli-chain-a-backup/" --endpoint-url https://s3.eu-west-par.io.cloud.ovh.net \
      | awk '{print $4}' | grep "^${APP_NAME}-" | sort -r | tail -n +3)
    for OLD_BLOB in $CHAIN_A_OLD; do
      OLD_RUN_ID=$(echo "$OLD_BLOB" | sed "s/^${APP_NAME}-//;s/\.age$//")
      echo "Deleting old Chain A blob: $OLD_BLOB (run_id: $OLD_RUN_ID)"
      "$AWS_PY" "$AWS" s3 rm "s3://scopuli-chain-a-backup/${OLD_BLOB}" --endpoint-url https://s3.eu-west-par.io.cloud.ovh.net
      echo "Deleting corresponding Azure Key Vault secret: ${APP_NAME}-${OLD_RUN_ID}"
      AZ_TOKEN=$($CURL $CURL_OPTS -s -X POST "https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/v2.0/token" \
        -d "grant_type=client_credentials&client_id=${AZURE_CLIENT_ID}&client_secret=${AZURE_CLIENT_SECRET}&scope=https://vault.azure.net/.default" \
        | "$JQ" -r '.access_token')
      $CURL $CURL_OPTS -s -X DELETE "https://kv-solsys-chainb.vault.azure.net/secrets/${APP_NAME}-${OLD_RUN_ID}?api-version=7.4" \
        -H "Authorization: Bearer $AZ_TOKEN" -o /dev/null -w "  delete: HTTP %{http_code}\n"
      $CURL $CURL_OPTS -s -X DELETE "https://kv-solsys-chainb.vault.azure.net/deletedsecrets/${APP_NAME}-${OLD_RUN_ID}?api-version=7.4" \
        -H "Authorization: Bearer $AZ_TOKEN" -o /dev/null -w "  purge: HTTP %{http_code}\n"
    done

    echo "Pruning Chain B (Backblaze)..."
    export AWS_ACCESS_KEY_ID="$B2_KEY_ID"
    export AWS_SECRET_ACCESS_KEY="$B2_KEY_SECRET"
    CHAIN_B_OLD=$("$AWS_PY" "$AWS" s3 ls "s3://barbapiccola-chain-b-backup/" --endpoint-url https://s3.eu-central-003.backblazeb2.com \
      | awk '{print $4}' | grep "^${APP_NAME}-" | sort -r | tail -n +3)
    export BWS_SERVER_URL="https://vault.bitwarden.eu"
    for OLD_BLOB in $CHAIN_B_OLD; do
      OLD_RUN_ID=$(echo "$OLD_BLOB" | sed "s/^${APP_NAME}-//;s/\.age$//")
      echo "Deleting old Chain B blob: $OLD_BLOB (run_id: $OLD_RUN_ID)"
      "$AWS_PY" "$AWS" s3 rm "s3://barbapiccola-chain-b-backup/${OLD_BLOB}" --endpoint-url https://s3.eu-central-003.backblazeb2.com
      echo "Deleting corresponding Bitwarden secret: ${APP_NAME}-${OLD_RUN_ID}"
      OLD_SECRET_ID=$(/tmp/bws secret list "$BW_PROJECT_ID" --access-token "$BW_ACCESS_TOKEN" \
        | "$JQ" -r ".[] | select(.key==\"${APP_NAME}-${OLD_RUN_ID}\") | .id")
      if [ -n "$OLD_SECRET_ID" ]; then
        /tmp/bws secret delete "$OLD_SECRET_ID" --access-token "$BW_ACCESS_TOKEN" > /dev/null
        echo "  deleted secret $OLD_SECRET_ID"
      else
        echo "  WARNING: could not find matching Bitwarden secret for ${APP_NAME}-${OLD_RUN_ID}"
      fi
    done

    echo "Backup run $RUN_ID complete."
