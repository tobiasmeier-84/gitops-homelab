apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-worker-script
  namespace: rocinante
data:
  backup-worker.sh: |
    #!/bin/sh
    set -e

    apk add --no-cache age zstd tar aws-cli curl jq > /dev/null 2>&1

    ARCHIVE="/tmp/${APP_NAME}-${RUN_ID}.tar.zst"
    echo "Compressing /data..."
    tar -C /data -cf - . | zstd -T0 -o "$ARCHIVE"

    echo "Generating Chain A keypair..."
    age-keygen -o /tmp/chain-a.key 2>/tmp/chain-a-pub.txt
    CHAIN_A_PUBKEY=$(grep "Public key:" /tmp/chain-a-pub.txt | awk '{print $NF}')
    CHAIN_A_PRIVKEY=$(cat /tmp/chain-a.key)

    echo "Generating Chain B keypair..."
    age-keygen -o /tmp/chain-b.key 2>/tmp/chain-b-pub.txt
    CHAIN_B_PUBKEY=$(grep "Public key:" /tmp/chain-b-pub.txt | awk '{print $NF}')
    CHAIN_B_PRIVKEY=$(cat /tmp/chain-b.key)

    echo "Encrypting for Chain A..."
    age -r "$CHAIN_A_PUBKEY" -o "${ARCHIVE}.chainA.age" "$ARCHIVE"

    echo "Encrypting for Chain B..."
    age -r "$CHAIN_B_PUBKEY" -o "${ARCHIVE}.chainB.age" "$ARCHIVE"

    echo "Uploading Chain A blob to OVHcloud..."
    export AWS_ACCESS_KEY_ID="$OVH_S3_ACCESS_KEY"
    export AWS_SECRET_ACCESS_KEY="$OVH_S3_SECRET_KEY"
    aws s3 cp "${ARCHIVE}.chainA.age" "s3://scopuli-chain-a-backup/${APP_NAME}-${RUN_ID}.age" \
      --endpoint-url https://s3.eu-west-par.io.cloud.ovh.net

    echo "Uploading Chain B blob to Backblaze..."
    export AWS_ACCESS_KEY_ID="$B2_KEY_ID"
    export AWS_SECRET_ACCESS_KEY="$B2_KEY_SECRET"
    aws s3 cp "${ARCHIVE}.chainB.age" "s3://barbapiccola-chain-b-backup/${APP_NAME}-${RUN_ID}.age" \
      --endpoint-url https://s3.eu-central-003.backblazeb2.com

    echo "Storing Chain A key in Azure Key Vault..."
    AZ_TOKEN=$(curl -s -X POST "https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/v2.0/token" \
      -d "grant_type=client_credentials&client_id=${AZURE_CLIENT_ID}&client_secret=${AZURE_CLIENT_SECRET}&scope=https://vault.azure.net/.default" \
      | jq -r '.access_token')
    curl -s -X PUT "https://kv-solsys-chainb.vault.azure.net/secrets/${APP_NAME}-${RUN_ID}?api-version=7.4" \
      -H "Authorization: Bearer $AZ_TOKEN" -H "Content-Type: application/json" \
      -d "{\"value\":\"$CHAIN_A_PRIVKEY\"}"

    echo "Storing Chain B key in Bitwarden Secrets Manager..."
    curl -sL https://github.com/bitwarden/sdk-sm/releases/latest/download/bws-x86_64-unknown-linux-musl.zip -o /tmp/bws.zip
    unzip -o /tmp/bws.zip -d /tmp
    /tmp/bws secret create "${APP_NAME}-${RUN_ID}" "$CHAIN_B_PRIVKEY" "$BW_PROJECT_ID" \
      --access-token "$BW_ACCESS_TOKEN" --api-url https://api.bitwarden.eu --identity-url https://identity.bitwarden.eu

    echo "MANIFEST_ENTRY:{\"run_id\":\"${RUN_ID}\",\"app\":\"${APP_NAME}\",\"chainA_blob\":\"${APP_NAME}-${RUN_ID}.age\",\"chainA_key_ref\":\"azure-kv:${APP_NAME}-${RUN_ID}\",\"chainB_blob\":\"${APP_NAME}-${RUN_ID}.age\",\"chainB_key_ref\":\"bitwarden:${APP_NAME}-${RUN_ID}\"}"