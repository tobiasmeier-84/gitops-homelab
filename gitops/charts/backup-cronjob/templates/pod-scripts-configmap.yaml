apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-pod-scripts
  namespace: {{ .Values.namespace }}
data:
  rsync-lib.sh: |
    # Sourced by copy.sh and receiver.sh (not executed directly).
    setup_rsync() {
      mkdir -p /tmp/pkgroot
      apk add --no-cache --root /tmp/pkgroot --initdb --repositories-file /etc/apk/repositories --allow-untrusted rsync || echo "apk had non-fatal post-install trigger errors (expected under non-root), continuing"
      export LD_LIBRARY_PATH="/tmp/pkgroot/usr/lib:/tmp/pkgroot/lib:$LD_LIBRARY_PATH"
      RSYNC="/tmp/pkgroot/usr/bin/rsync"
      if [ ! -x "$RSYNC" ]; then
        echo "FATAL: rsync not found at $RSYNC after install"
        exit 1
      fi
    }

    # run_rsync LABEL SRC DST
    # Retries only network-level failures (exit 10/12/30/35). Exit 24 (files
    # vanished while the app is online) is expected and accepted.
    run_rsync() {
      label="$1"
      src="$2"
      dst="$3"
      attempt=0
      while true; do
        rc=0
        # RSYNC_BWLIMIT (KB/s) is a real mitigation, not a diagnosed fix - the actual
        # root cause of replica ejections under bulk writes is still not fully
        # understood (see ADR-0005 addendum, 2026-09-28). Set to "0" to disable.
        BWLIMIT_ARG=""
        if [ -n "$RSYNC_BWLIMIT" ] && [ "$RSYNC_BWLIMIT" != "0" ]; then
          BWLIMIT_ARG="--bwlimit=$RSYNC_BWLIMIT"
        fi
        "$RSYNC" -a --delete --exclude=/lost+found --stats --timeout=300 --contimeout=30 $BWLIMIT_ARG "$src" "$dst" || rc=$?
        case "$rc" in
          0|24)
            return 0
            ;;
          10|12|30|35)
            ;;
          *)
            echo "$label: rsync failed with exit $rc - not retrying (only network errors are retried)"
            return 1
            ;;
        esac
        attempt=$((attempt + 1))
        echo "$label: network error, rsync exit $rc (attempt $attempt of 3)"
        if [ "$attempt" -ge 3 ]; then
          return 1
        fi
        sleep 30
      done
    }

  receiver.sh: |
    #!/bin/sh
    set -e
    . /scripts/rsync-lib.sh
    setup_rsync

    mkdir -p /restore-local/data
    umask 077
    printf 'backup:%s\n' "$RSYNC_PASSWORD" > /tmp/rsyncd.secrets
    chmod 600 /tmp/rsyncd.secrets

    cat > /tmp/rsyncd.conf << 'CONF'
    pid file = /tmp/rsyncd.pid
    lock file = /tmp/rsyncd.lock
    log file = /tmp/rsyncd.log
    use chroot = no
    port = 8873
    [data]
        path = /restore-local/data
        read only = no
        list = no
        auth users = backup
        secrets file = /tmp/rsyncd.secrets
    CONF

    : > /tmp/rsyncd.log
    tail -F /tmp/rsyncd.log &
    ( while true; do sleep 300; echo "heartbeat $(date -u +%H:%M:%SZ): $(df -h /restore-local | tail -1)"; done ) &
    echo "Starting rsync daemon on port 8873, module 'data' -> /restore-local/data"
    exec "$RSYNC" --daemon --no-detach --config=/tmp/rsyncd.conf

  copy.sh: |
    #!/bin/sh
    set -e
    . /scripts/rsync-lib.sh
    setup_rsync

    DEST="rsync://backup@${RSYNC_HOST}:8873/data/"
    echo "Sending to $DEST"

    echo "=== PASS 1: application online, data may change during this copy ==="
    run_rsync "pass1" /live-data/ "$DEST"
    touch /tmp/pass1-done
    echo "PASS1_DONE"

    echo "Waiting for the orchestrator's go-ahead (maintenance mode on) for pass 2..."
    waited=0
    while [ ! -f /tmp/start-pass2 ]; do
      sleep 2
      waited=$((waited + 2))
      if [ "$waited" -ge 7200 ]; then
        echo "FATAL: no go-ahead within 2h, giving up"
        exit 1
      fi
    done

    echo "=== PASS 2: maintenance mode on, incremental catch-up ==="
    run_rsync "pass2" /live-data/ "$DEST"
    echo "COPY_DONE"

  dbdump.sh: |
    #!/bin/sh
    set -e
    mkdir -p /tmp/pkgroot
    apk add --no-cache --root /tmp/pkgroot --initdb --repositories-file /etc/apk/repositories --allow-untrusted --repository https://dl-cdn.alpinelinux.org/alpine/edge/main postgresql18-client || echo "apk had non-fatal post-install trigger errors (expected under non-root), continuing"
    export LD_LIBRARY_PATH="/tmp/pkgroot/usr/lib:/tmp/pkgroot/lib:$LD_LIBRARY_PATH"
    PGDUMP="/tmp/pkgroot/usr/libexec/postgresql18/pg_dump"
    if [ ! -x "$PGDUMP" ]; then
      echo "FATAL: pg_dump not found at $PGDUMP"
      exit 1
    fi
    mkdir -p /restore-local/db
    rm -f /restore-local/db/dump.sql
    export PGPASSWORD="$password"
    echo "Dumping database..."
    "$PGDUMP" -h "$DB_HOST" -p "$DB_PORT" -U "$username" -d "$dbname" -F c -f /restore-local/db/dump.sql
    echo "DB dump complete."

  fileprocess.sh: |
    #!/bin/sh
    set -e
    mkdir -p /tmp/pkgroot
    apk add --no-cache --root /tmp/pkgroot --initdb --repositories-file /etc/apk/repositories --allow-untrusted zstd || echo "apk had non-fatal post-install trigger errors (expected under non-root), continuing"
    export LD_LIBRARY_PATH="/tmp/pkgroot/usr/lib:/tmp/pkgroot/lib:$LD_LIBRARY_PATH"
    ZSTD="/tmp/pkgroot/usr/bin/zstd"
    if [ ! -x "$ZSTD" ]; then
      echo "FATAL: zstd not found at $ZSTD"
      exit 1
    fi
    ARCHIVE="/scratch/${APP_NAME}-${RUN_ID}.tar.zst"
    rm -f /tmp/tar.ok
    echo "Compressing..."
    ( tar -C /restore-local/data -cf - . && echo 0 > /tmp/tar.ok ) | "$ZSTD" -T4 -o "$ARCHIVE"
    if [ "$(cat /tmp/tar.ok 2>/dev/null)" != "0" ]; then
      echo "FATAL: tar did not finish cleanly - archive is not trustworthy."
      exit 1
    fi
    ARCHIVE_SIZE=$(stat -c%s "$ARCHIVE")
    echo "Archive size: ${ARCHIVE_SIZE} bytes"
    if [ "$ARCHIVE_SIZE" -lt 1048576 ]; then
      echo "FATAL: archive suspiciously small, aborting."
      exit 1
    fi
    if ! "$ZSTD" -t "$ARCHIVE"; then
      echo "FATAL: zstd integrity check failed."
      exit 1
    fi
    echo "=== STOPPING HERE: encryption, key storage, upload and prune are not enabled in this test phase ==="
    echo "File processing complete."

  dbprocess.sh: |
    #!/bin/sh
    set -e
    if [ ! -f /restore-local/db/dump.sql ]; then
      echo "FATAL: no dump file found."
      exit 1
    fi
    DUMP_SIZE=$(stat -c%s /restore-local/db/dump.sql)
    echo "Dump size: ${DUMP_SIZE} bytes"
    if [ "$DUMP_SIZE" -lt 10240 ]; then
      echo "FATAL: dump suspiciously small, aborting."
      exit 1
    fi
    echo "=== STOPPING HERE: encryption, key storage, upload and prune are not enabled in this test phase ==="
    echo "DB processing complete."
