apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.appName }}-backup
  namespace: {{ .Values.namespace }}
spec:
  schedule: {{ .Values.schedule | quote }}
  timeZone: {{ .Values.timeZone | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 604800
      backoffLimit: 0
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: {{ .Values.appName }}-backup
        spec:
          serviceAccountName: {{ .Values.appName }}-backup
          restartPolicy: Never
          # Long enough for the cleanup trap (clone volume, snapshot, worker pod) to finish.
          terminationGracePeriodSeconds: 120
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: orchestrator
              image: {{ .Values.image | quote }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              # Only the mail credentials; the storage credentials never reach this pod.
              envFrom:
                - secretRef:
                    name: backup-smtp-credentials
              env:
                - name: APP_NAME
                  value: {{ .Values.appName | quote }}
                - name: NAMESPACE
                  value: {{ .Values.namespace | quote }}
                - name: PVC_NAME
                  value: {{ required "pvcName is required" .Values.pvcName | quote }}
                - name: WORKER_RUN_AS_USER
                  value: {{ required "workerRunAsUser is required" .Values.workerRunAsUser | quote }}
                - name: WORKER_RUN_AS_GROUP
                  value: {{ default .Values.workerRunAsUser .Values.workerRunAsGroup | quote }}
                - name: IMAGE
                  value: {{ .Values.image | quote }}
                - name: DRY_RUN
                  value: {{ .Values.dryRun | quote }}
                - name: MAX_AGE_DAYS
                  value: {{ .Values.maxAgeDays | quote }}
                - name: SNAPSHOT_CLASS
                  value: {{ .Values.snapshotClass | quote }}
                - name: CLONE_STORAGE_CLASS
                  value: {{ .Values.cloneStorageClass | quote }}
                - name: WORK_DIR_SIZE
                  value: {{ .Values.workDirSize | quote }}
                - name: CHUNK_MIB
                  value: {{ .Values.chunkMiB | quote }}
                - name: UPLOAD_MAX_BANDWIDTH_KBPS
                  value: {{ .Values.uploadMaxBandwidthKBps | quote }}
                - name: BUCKET_A
                  value: {{ .Values.chains.a.bucket | quote }}
                - name: EP_A
                  value: {{ .Values.chains.a.endpoint | quote }}
                - name: BUCKET_B
                  value: {{ .Values.chains.b.bucket | quote }}
                - name: EP_B
                  value: {{ .Values.chains.b.endpoint | quote }}
                - name: NOTIFY_EMAIL
                  value: {{ .Values.notifyEmail | quote }}
                - name: NOTIFY_SUCCESS_WEEKDAY
                  value: {{ .Values.notifySuccessWeekday | quote }}
              command: ["/bin/sh", "/scripts/orchestrate.sh"]
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: notify-script
                  mountPath: /scripts-notify
          volumes:
            - name: scripts
              configMap:
                name: {{ .Values.appName }}-backup-scripts
            - name: notify-script
              configMap:
                name: {{ .Values.appName }}-backup-notify
---
# Suspended on purpose: run it by hand after the credentials or the library changed (see selftest.sh):
#   kubectl -n <ns> create job --from=cronjob/<app>-backup-selftest <app>-backup-selftest-1
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.appName }}-backup-selftest
  namespace: {{ .Values.namespace }}
spec:
  schedule: "0 0 1 1 *"
  suspend: true
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: {{ .Values.appName }}-backup
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: {{ required "workerRunAsUser is required" .Values.workerRunAsUser }}
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: selftest
              image: {{ .Values.image | quote }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              envFrom:
                - secretRef:
                    name: backup-chain-credentials
              env:
                - name: APP_NAME
                  value: {{ .Values.appName | quote }}
                - name: MAX_AGE_DAYS
                  value: {{ .Values.maxAgeDays | quote }}
                - name: CHUNK_MIB
                  value: "64"
                - name: BUCKET_A
                  value: {{ .Values.chains.a.bucket | quote }}
                - name: EP_A
                  value: {{ .Values.chains.a.endpoint | quote }}
                - name: BUCKET_B
                  value: {{ .Values.chains.b.bucket | quote }}
                - name: EP_B
                  value: {{ .Values.chains.b.endpoint | quote }}
                - name: PROBE_OTHER_VAULT_URL
                  value: {{ .Values.probeOtherVaultUrl | quote }}
              command: ["/bin/sh", "/scripts/selftest.sh"]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 1Gi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
          volumes:
            - name: scripts
              configMap:
                name: {{ .Values.appName }}-backup-scripts
