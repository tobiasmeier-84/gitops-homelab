apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: behemoth
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/tobiasmeier-84/gitops-homelab.git
    targetRevision: master
    path: gitops/manifests/behemoth
  destination:
    server: https://kubernetes.default.svc
    namespace: behemoth
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
