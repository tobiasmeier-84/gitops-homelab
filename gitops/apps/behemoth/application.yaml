apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: behemoth
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/tobiasmeier-84/gitops-homelab.git
    targetRevision: master
    path: gitops/manifests/behemoth
  destination:
    server: https://kubernetes.default.svc
    namespace: behemoth
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # The Plex image starts as root and drops to PLEX_UID/PLEX_GID itself, which PodSecurity
    # "restricted" forbids. Only this namespace is on baseline; warn/audit keep reporting restricted.
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: baseline
        pod-security.kubernetes.io/enforce-version: latest
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/audit: restricted
