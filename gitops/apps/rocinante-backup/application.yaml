apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rocinante-backup
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/tobiasmeier-84/gitops-homelab.git
    targetRevision: master
    path: gitops/charts/backup-cronjob
    helm:
      values: |
        appName: rocinante
        namespace: rocinante
        pvcName: rocinante-nextcloud-nextcloud
        pvcSize: 250Gi
        schedule: "0 6 * * 1,3,5"        # PREPARE: Mon, Wed, Fri 06:00 (Friday = weekly backup)
        uploadSchedule: "1 0 * * *"      # UPLOAD window opens every night at 00:01
        uploadWindowMinutes: 479         # ... and closes at 08:00 (resumes the next night if not finished)
        uploadMaxBandwidthKBps: 3000     # TEMPORARY 2026-10-29 (network collapse test, revisit after MikroTik); 0 = unlimited
        timeZone: Europe/Zurich
        retention:
          daily: 1          # newest daily backups kept per chain
          weekly: 2         # newest weekly backups kept per chain
          weeklyDay: 5      # ISO weekday of the weekly backup (5 = Friday, 0 = no weekly class)
        uploadEnabled: true
        workerRunAsUser: 33
  destination:
    server: https://kubernetes.default.svc
    namespace: rocinante
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
