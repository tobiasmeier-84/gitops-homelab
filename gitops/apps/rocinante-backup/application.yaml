apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rocinante-backup
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/tobiasmeier-84/gitops-homelab.git
    targetRevision: master
    path: gitops/charts/backup-cronjob
    helm:
      values: |
        appName: rocinante
        namespace: rocinante
        pvcName: rocinante-nextcloud-nextcloud
        pvcSize: 250Gi
        schedule: "0 0 20 10 *"
        uploadEnabled: true
        workerRunAsUser: 33
  destination:
    server: https://kubernetes.default.svc
    namespace: rocinante
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
