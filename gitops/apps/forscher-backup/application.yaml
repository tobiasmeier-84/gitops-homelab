apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forscher-backup
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/tobiasmeier-84/gitops-homelab.git
    targetRevision: master
    path: gitops/charts/app-backup
    helm:
      values: |
        appName: forscher
        namespace: forscher
        pvcName: forscher-data
        workerRunAsUser: 10001
        workerRunAsGroup: 10001
        schedule: "30 3 * * *"       # daily 03:30 Europe/Zurich
        maxAgeDays: 13               # app maximum is 14 days (privacy by design)
        dryRun: false               # first real run on 2026-11-03 after self-test and dry run
  destination:
    server: https://kubernetes.default.svc
    namespace: forscher
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
