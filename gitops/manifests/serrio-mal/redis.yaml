apiVersion: apps/v1
kind: Deployment
metadata:
  name: serrio-mal
  namespace: rocinante
spec:
  replicas: 1
  selector:
    matchLabels:
      app: serrio-mal
  template:
    metadata:
      labels:
        app: serrio-mal
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.4-alpine
          ports:
            - containerPort: 6379
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: serrio-mal
  namespace: rocinante
spec:
  selector:
    app: serrio-mal
  ports:
    - port: 6379
      targetPort: 6379