apiVersion: apps/v1
kind: Deployment
metadata:
  name: behemoth
  namespace: behemoth
  labels:
    app.kubernetes.io/name: behemoth
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: behemoth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: behemoth
    spec:
      nodeSelector:
        kubernetes.io/hostname: rhea
      securityContext:
        # Volumes are handed to group 1000. OnRootMismatch: only the top-level directory is
        # checked, so no recursive chown of the media tree on later starts.
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: plex
          image: plexinc/pms-docker:1.43.5.11029-6bf8af3f0
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Europe/Zurich
            # The image starts as root (s6) and runs Plex itself as this uid/gid.
            - name: PLEX_UID
              value: "1000"
            - name: PLEX_GID
              value: "1000"
            # Only needed for the first start (token is valid for 4 minutes). Created by hand,
            # never committed:  kubectl -n behemoth create secret generic plex-claim --from-literal=token=claim-XXXX
            - name: PLEX_CLAIM
              valueFrom:
                secretKeyRef:
                  name: plex-claim
                  key: token
                  optional: true
            # Plain http until a certificate for plex.app.solsys.dev is installed; clients still use
            # Plex's own *.plex.direct https address. Do NOT set ALLOWED_NETWORKS (it disables auth).
            - name: ADVERTISE_IP
              value: "http://plex.app.solsys.dev:32400/"
          ports:
            - name: plex
              containerPort: 32400
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /identity
              port: 32400
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /identity
              port: 32400
            initialDelaySeconds: 180
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 6Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              # Only what s6 needs to chown /config, signal services and drop to uid 1000.
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "KILL", "SETGID", "SETUID"]
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /data
            - name: transcode
              mountPath: /transcode
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: behemoth-config
        - name: media
          persistentVolumeClaim:
            claimName: behemoth-media
        - name: transcode
          emptyDir:
            sizeLimit: 20Gi
