apiVersion: v1
kind: ServiceAccount
metadata:
  name: rocinante-oidc-configurator
  namespace: rocinante
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rocinante-oidc-configurator
  namespace: rocinante
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec"]
    verbs: ["get", "list", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rocinante-oidc-configurator
  namespace: rocinante
subjects:
  - kind: ServiceAccount
    name: rocinante-oidc-configurator
roleRef:
  kind: Role
  name: rocinante-oidc-configurator
  apiGroup: rbac.authorization.k8s.io