apiVersion: batch/v1
kind: Job
metadata:
  name: rocinante-configure
  namespace: rocinante
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: rocinante-oidc-configurator
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: configure
          image: alpine/k8s:1.30.3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          envFrom:
            - secretRef:
                name: rocinante-oidc-credentials
          command:
            - /bin/sh
            - -c
            - |
              set -e
              POD=$(kubectl get pods -n rocinante -l app.kubernetes.io/name=nextcloud -o jsonpath='{.items[0].metadata.name}')

              echo "Waiting for Nextcloud pod to be ready..."
              kubectl wait --for=condition=ready pod/$POD -n rocinante --timeout=180s

              kubectl exec -n rocinante $POD -- su -s /bin/sh www-data -c "php occ app:enable user_oidc" || true

              kubectl exec -n rocinante $POD -- su -s /bin/sh www-data -c "php occ user_oidc:provider entraid --clientid='$client_id' --clientsecret='$client_secret' --discoveryuri='https://login.microsoftonline.com/0b87a43d-5640-4e22-a2f2-d13394ff6191/v2.0/.well-known/openid-configuration' --scope='openid profile email' --mapping-uid=preferred_username --unique-uid=0"

              kubectl exec -n rocinante $POD -- su -s /bin/sh www-data -c "php occ config:system:set overwrite.cli.url --value=https://rocinante.gate.solsys.dev"

              kubectl exec -n rocinante $POD -- su -s /bin/sh www-data -c "php occ config:system:set trusted_domains 0 --value=localhost"
              kubectl exec -n rocinante $POD -- su -s /bin/sh www-data -c "php occ config:system:set trusted_domains 1 --value=rocinante.gate.solsys.dev"
              kubectl exec -n rocinante $POD -- su -s /bin/sh www-data -c "php occ config:system:set trusted_domains 2 --value=nextcloud.app.solsys.dev"

              # Trust Traefik's forwarded headers, scoped to the actual pod network —
              # required since Traefik terminates real HTTPS, Nextcloud only ever sees plain HTTP internally
              kubectl exec -n rocinante $POD -- su -s /bin/sh www-data -c "php occ config:system:set trusted_proxies 0 --value=10.42.0.0/16"
              kubectl exec -n rocinante $POD -- su -s /bin/sh www-data -c "php occ config:system:set forwarded_for_headers 0 --value=HTTP_X_FORWARDED_FOR"

              # Low-usage maintenance window (01:00 UTC)
              kubectl exec -n rocinante $POD -- su -s /bin/sh www-data -c "php occ config:system:set maintenance_window_start --value=1"

              # Safe, idempotent one-time repairs
              kubectl exec -n rocinante $POD -- su -s /bin/sh www-data -c "php occ maintenance:repair --include-expensive"
              kubectl exec -n rocinante $POD -- su -s /bin/sh www-data -c "php occ db:add-missing-indices"

              # base64-encode/decode to survive multiple nested shell layers cleanly —
              # naive backslash-escaping through sh -c -> kubectl exec -> su -c -> occ
              # proved unreliable in testing (confirmed: 8 backslashes -> 2 stored, not 4)
              REDIS_VALUE=$(printf '\\OC\\Memcache\\Redis' | base64)
              kubectl exec -n rocinante $POD -- su -s /bin/sh www-data -c "php occ config:system:set memcache.locking --value=\$(echo $REDIS_VALUE | base64 -d)"

              kubectl exec -n rocinante $POD -- su -s /bin/sh www-data -c "php occ config:system:set redis host --value=serrio-mal.rocinante.svc.cluster.local"
              kubectl exec -n rocinante $POD -- su -s /bin/sh www-data -c "php occ config:system:set redis port --value=6379 --type=integer"

              kubectl exec -n rocinante $POD -- su -s /bin/sh www-data -c "php occ config:system:set default_phone_region --value=CH"

              echo "Done."